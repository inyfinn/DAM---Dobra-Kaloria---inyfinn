<!doctype html>
<html lang="pl" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Branding - DAM</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/vendor/css/bootstrap/bootstrap.css">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/dam-tokens.css?v=20260718v7f">
  <link rel="stylesheet" href="./assets/css/dam-app.css?v=20260718searchUnify3">
  <link rel="stylesheet" href="./assets/css/dam-brand.css?v=20260719ver102">
  <link rel="stylesheet" href="./assets/css/dam-branding.css?v=20260719branding1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@iconscout/unicons@4.0.8/css/line.min.css">
</head>
<body class="geex-dashboard dam-app">
  <header class="geex-header">
    <motion.div class="geex-header__wrapper">
      <div class="geex-header__logo-wrapper">
        <a href="dashboard.html" class="geex-header__logo">
          <img class="logo-lite" src="assets/img/logo-dark.svg" alt="DAM" />
        </a>
      </div>
    </div>
  </header>
  <main class="geex-main-content">
    <div class="geex-content">
      <div class="geex-content__header">
        <div class="geex-content__header__content">
          <h2 class="geex-content__header__title">Branding</h2>
          <p class="geex-content__header__subtitle">Kampanie, materiały graficzne, brandbook</p>
        </div>
        <div class="geex-content__header__action">
          <button type="button" class="geex-btn geex-btn--primary-transparent" id="damBrandingRebuild">Przebuduj indeks</button>
        </div>
      </div>
      <div class="dam-branding-tabs" role="tablist">
        <button type="button" class="dam-branding-tab is-active" data-tab="browse">Przeglądaj</button>
        <button type="button" class="dam-branding-tab" data-tab="campaigns">Kampanie</button>
        <button type="button" class="dam-branding-tab" data-tab="channels">Kanały</button>
        <button type="button" class="dam-branding-tab" data-tab="brandbook">Brandbook</button>
        <button type="button" class="dam-branding-tab" data-tab="layout">Layout builder</button>
      </div>
      <div class="dam-branding-toolbar">
        <input type="search" id="damBrandingSearch" class="geex-content__form__input" placeholder="Szukaj assetów, SKU, kampanii…" />
        <select id="damBrandingMedia" class="geex-content__form__input">
          <option value="">Wszystkie media</option>
          <option value="raster">Raster</option>
          <option value="vector">Wektor</option>
          <option value="video">Wideo</option>
        </select>
        <select id="damBrandingPerspective" class="geex-content__form__input">
          <option value="">Perspektywa</option>
          <option value="ENFACE">ENFACE</option>
          <option value="FRONT">FRONT</option>
          <option value="BACK">BACK</option>
          <option value="TYL_ENFACE">TYŁ-ENFACE</option>
        </select>
        <select id="damBrandingBrand" class="geex-content__form__input">
          <option value="">Marka</option>
          <option value="DK">DK</option>
          <option value="GC">GC</option>
        </select>
      </div>
      <div id="damBrandingPanelBrowse" class="dam-branding-panel">
        <motion.div id="damBrandingGrid" class="dam-branding-grid"></div>
      </div>
      <div id="damBrandingPanelCampaigns" class="dam-branding-panel" hidden>
        <div id="damBrandingCampaignTree" class="dam-branding-campaign-tree"></motion.div>
      </div>
      <div id="damBrandingPanelChannels" class="dam-branding-panel" hidden>
        <p class="dam-branding-muted">Filtruj po kanale w wyszukiwarce (meta, instagram, www…).</p>
      </div>
      <div id="damBrandingPanelBrandbook" class="dam-branding-panel" hidden>
        <div id="damBrandbookTokens" class="dam-brandbook-tokens"></div>
      </div>
      <motion.div id="damBrandingPanelLayout" class="dam-branding-panel" hidden>
        <p class="dam-branding-muted">Layout builder — presety (wkrótce PNG export).</p>
      </div>
    </div>
  </main>
  <div class="dam-branding-modal" id="damBrandingModal" hidden>
    <div class="dam-branding-modal__backdrop" data-close="1"></div>
    <div class="dam-branding-modal__card" role="dialog" aria-modal="true">
      <button type="button" class="dam-branding-modal__close" data-close="1" aria-label="Zamknij">×</button>
      <div id="damBrandingModalMedia" class="dam-branding-modal__media"></div>
      <div id="damBrandingModalMeta" class="dam-branding-modal__meta"></div>
    </div>
  </motion.div>
  <script src="./assets/vendor/js/jquery/jquery-3.5.1.min.js"></script>
  <script src="./assets/js/dam-api.js?v=20260719golive1"></script>
  <script src="./assets/js/dam-runtime.js?v=20260718app1"></script>
  <script src="./assets/js/dam-shell.js?v=20260719branding1"></script>
  <script src="./assets/js/dam-branding.js?v=20260719branding1"></script>
</body>
</html>

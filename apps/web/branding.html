<!doctype html>
<html lang="pl" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Branding - DAM</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/vendor/css/bootstrap/bootstrap.css">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/dam-tokens.css?v=20260718v7f">
  <link rel="stylesheet" href="./assets/css/dam-app.css?v=20260718searchUnify3">
  <link rel="stylesheet" href="./assets/css/dam-hub-shared.css?v=hub20260719grad08">
  <link rel="stylesheet" href="./assets/css/dam-brand.css?v=hub20260719modal10">
  <link rel="stylesheet" href="./assets/css/dam-branding.css?v=hub20260719modal10">
  <link rel="stylesheet" href="./assets/css/dam-bento.css?v=bento200f">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@iconscout/unicons@4.0.8/css/line.min.css">
  <script>
    if (localStorage.theme) document.documentElement.setAttribute("data-theme", localStorage.theme);
  </script>
</head>
<body class="geex-dashboard dam-app">
  <div class="dam-sidebar-backdrop" id="damSidebarBackdrop"></div>
  <header class="geex-header">
    <div class="geex-header__wrapper">
      <div class="geex-header__logo-wrapper">
        <a href="dashboard.html" class="geex-header__logo" title="Dobra Kaloria - DAM">
          <img class="logo-lite dam-logo-dk" src="assets/img/logo-dk-green.svg" alt="Dobra Kaloria" />
          <img class="logo-dark dam-logo-dk" src="assets/img/logo-dk-green.svg" alt="Dobra Kaloria" />
        </a>
        <button type="button" class="geex-btn geex-btn--primary dam-menu-toggle d-lg-none" id="damSidebarToggle" aria-label="Menu">
          <i class="uil uil-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="geex-main-content">
    <div class="geex-sidebar" id="damSidebar">
      <a href="#" class="geex-sidebar__close" id="damSidebarClose" aria-label="Zamknij menu"><i class="uil uil-times"></i></a>
      <div class="geex-sidebar__wrapper">
        <div class="geex-sidebar__header">
          <a href="dashboard.html" class="geex-sidebar__logo" title="Dobra Kaloria - DAM">
            <img class="logo-lite dam-logo-dk" src="assets/img/logo-dk-green.svg" alt="Dobra Kaloria" width="150" height="48" />
            <img class="logo-dark dam-logo-dk" src="assets/img/logo-dk-green.svg" alt="Dobra Kaloria" width="150" height="48" />
          </a>
        </div>
        <nav class="geex-sidebar__menu-wrapper">
          <ul class="geex-sidebar__menu"></ul>
        </nav>
      </div>
    </div>

    <div class="geex-content">
      <div class="geex-content__header">
        <div class="geex-content__header__content">
          <h2 class="geex-content__header__title">Branding</h2>
          <p class="geex-content__header__subtitle dam-page-sub">Tu trzymamy reklamy, filmy i grafiki marki — wpisz słowo albo kliknij kolorowy tag.</p>
        </div>
        <div class="geex-content__header__action">
          <button type="button" class="geex-btn geex-btn--primary-transparent" id="damBrandingRebuild" data-dam-tip="Przeskanuj foldery Marketing i odśwież branding-index.json">Przebuduj indeks</button>
        </div>
      </div>

      <div class="dam-global-search-block">
        <div class="dam-explorer-toolbar dam-branding-toolbar">
          <div class="dam-search-wrap dam-search-wrap--panel">
            <div class="dam-search-input-wrap">
              <i class="uil uil-search" aria-hidden="true"></i>
              <input type="search" id="damBrandingSearch" class="form-control dam-search-input" placeholder="Np. burger, grill, proteina, slider niemięsa, film lato 2026…" autocomplete="off" aria-label="Szukaj w branding" data-dam-tip="Szuka po znaczeniu (tagi, skojarzenia produktów, nazwy kampanii) — nie po ścieżce folderu" />
            </div>
          </div>
        </div>
      </div>

      <div class="dam-branding-tabs-row">
        <div class="dam-branding-tabs" role="tablist" aria-label="Sekcje branding">
          <button type="button" class="dam-branding-tab is-active" data-tab="campaigns" role="tab" aria-selected="true">Kampanie</button>
          <button type="button" class="dam-branding-tab" data-tab="social" role="tab" aria-selected="false">Social &amp; wideo</button>
          <button type="button" class="dam-branding-tab" data-tab="www" role="tab" aria-selected="false">Strony WWW</button>
          <button type="button" class="dam-branding-tab" data-tab="packshots" role="tab" aria-selected="false">Packshoty</button>
          <button type="button" class="dam-branding-tab" data-tab="brandbook" role="tab" aria-selected="false">Brandbook</button>
        </div>
        <div class="dam-branding-tabs-meta">
          <p id="damBrandingSectionDesc" class="dam-branding-tabs-meta__desc"></p>
        </div>
      </div>

      <div class="dam-branding-tag-filters" id="damBrandingTagFilters" role="group" aria-label="Filtry tagami"></div>
      <div class="dam-viz-grid-toolbar dam-branding-grid-toolbar">
        <div id="damBrandingStatus" class="dam-toolbar-status" aria-live="polite">Ładowanie indeksu…</div>
      </div>
      <div class="dam-viz-secondary-filters dam-branding-filters dam-branding-filters--meta" role="group" aria-label="Opcje widoku">
        <label class="dam-switch dam-switch--compact" for="damBrandingGraphicsOnly" data-dam-tip="Ukrywa PDF, Excel i Word przy wyszukiwaniu. Dokumenty nadal po tagu Dokument.">
          <input type="checkbox" id="damBrandingGraphicsOnly" class="dam-switch__input" checked />
          <span class="dam-switch__track" aria-hidden="true"></span>
          <span class="dam-switch__label">Tylko grafiki</span>
        </label>
        <label class="dam-switch" for="damBrandingIncludeArchive" data-dam-tip="Domyślnie ukryte foldery ARCHIWUM na dysku Marketing">
          <input type="checkbox" id="damBrandingIncludeArchive" class="dam-switch__input" />
          <span class="dam-switch__track" aria-hidden="true"></span>
          <span class="dam-switch__label">Pokaż archiwum</span>
        </label>
        <div class="dam-branding-date-range" aria-label="Zakres dat pliku">
          <span class="dam-branding-date-range__label">Od</span>
          <input type="date" id="damBrandingDateFrom" aria-label="Data od" />
          <span class="dam-branding-date-range__label">Do</span>
          <input type="date" id="damBrandingDateTo" aria-label="Data do" />
          <div class="dam-branding-date-presets" id="damBrandingDatePresets" role="group" aria-label="Szybkie zakresy">
            <button type="button" data-preset="week">Ostatni tydzień</button>
            <button type="button" data-preset="month">Ostatni miesiąc</button>
            <button type="button" data-preset="2026">2026</button>
            <button type="button" data-preset="2025">2025</button>
          </div>
        </div>
        <label class="dam-branding-sort" for="damBrandingSort">
          <span class="dam-branding-date-range__label">Sortuj</span>
          <select id="damBrandingSort" aria-label="Sortowanie wyników">
            <option value="priority" selected>Priorytet użycia</option>
            <option value="newest">Najnowsze</option>
            <option value="oldest">Najstarsze</option>
            <option value="name">Nazwa</option>
          </select>
        </label>
        <label class="dam-switch dam-switch--compact" for="damBrandingTagCounts" data-dam-tip="Pokaż liczby dopasowań obok tagów (domyślnie wyłączone)">
          <input type="checkbox" id="damBrandingTagCounts" class="dam-switch__input" />
          <span class="dam-switch__track" aria-hidden="true"></span>
          <span class="dam-switch__label">Liczby przy tagach</span>
        </label>
        <button type="button" class="dam-branding-clear-btn" id="damBrandingClearTags">Wyczyść filtry</button>
        <label class="dam-viz-zoom-control" for="damBrandingCardZoom" data-dam-tip="Suwak: 65-100% pomniejsza grafikę w kafelku; powyżej 100% powiększa kafelek (max 350%). Podgląd startuje z tej samej skali.">
          <span class="dam-viz-zoom-control__label"><i class="uil uil-search-plus" aria-hidden="true"></i> Skala</span>
          <input type="range" id="damBrandingCardZoom" min="65" max="350" step="5" value="100" aria-label="Skala kafelkow branding" />
          <span class="dam-viz-zoom-control__value" id="damBrandingCardZoomLabel">100%</span>
        </label>
      </div>

      <div id="damBrandingContextBar" class="dam-branding-context" hidden>
        <button type="button" class="dam-branding-context__back" id="damBrandingBackBtn">
          <i class="uil uil-arrow-left" aria-hidden="true"></i> Wróć do przeglądania
        </button>
        <div class="dam-branding-context__chips" id="damBrandingContextChips" aria-label="Aktywne filtry"></div>
      </div>

      <div id="damBrandingPanelSection" class="dam-branding-panel">
        <div id="damBrandingDiscovery" class="dam-branding-discovery" hidden>
          <section class="dam-branding-discovery__block" id="damBrandingRecent" hidden></section>
        </div>
        <div id="damBrandingSectionGrid" class="dam-viz-grid dam-branding-grid"></div>
        <div id="damBrandingGridCount" class="dam-branding-grid-count" aria-live="polite" hidden></div>
      </div>
      <div id="damBrandingPanelBrandbook" class="dam-branding-panel" hidden>
        <div id="damBrandbookTokens" class="dam-brandbook-tokens"></div>
        <h4 class="dam-hub-section-title" style="margin:16px 0 8px">Assety brandbook</h4>
        <div id="damBrandbookGrid" class="dam-viz-grid dam-branding-grid"></div>
      </div>
    </div>
  </main>

  <script src="./assets/vendor/js/jquery/jquery-3.5.1.min.js"></script>
  <script src="./assets/vendor/js/bootstrap/bootstrap.min.js"></script>
  <script src="./assets/js/main.js"></script>
  <script src="./assets/js/dam-api.js?v=20260719golive1"></script>
  <script src="./assets/js/dam-i18n.js?v=20260718shell2"></script>
  <script src="./assets/js/dam-runtime.js?v=20260718app1"></script>
  <script src="./assets/js/dam-version.js?v=2.0.3"></script>
  <script src="./assets/js/dam-shell.js?v=hub20260719sticky02"></script>
  <script src="./assets/js/dam-paths.js?v=20260719ver102"></script>
  <script src="./assets/js/dam-tooltips.js?v=20260718admin3"></script>
  <script src="./assets/js/dam-icons.js?v=20260718icons2"></script>
  <script src="./assets/vendor/js/gsap/gsap.min.js"></script>
  <script src="./assets/js/dam-tag-bar.js?v=hub20260719j12"></script>
  <script src="./assets/js/dam-asset-taxonomy.js?v=hub20260719trans01"></script>
  <script src="./assets/js/dam-badges.js?v=hub20260719cards02"></script>
  <script src="./assets/js/dam-search.js?v=hub20260719assoc03"></script>
  <script src="./assets/js/dam-assoc-edit.js?v=hub20260719modal07"></script>
  <script src="./assets/js/dam-tag-edit.js?v=hub20260719j10"></script>
  <script src="./assets/js/dam-marketing-id.js?v=hub20260719ui05"></script>
  <script src="./assets/js/dam-modal-shared.js?v=hub20260719modal10"></script>
  <script src="./assets/js/dam-media-preview.js?v=hub20260719modal10"></script>
  <script src="./assets/js/dam-product-correlation.js?v=hub20260719corr01"></script>
  <script src="./assets/js/dam-grid-reveal.js?v=hub20260719reveal01"></script>
  <script src="./assets/js/dam-branding.js?v=hub20260719cache01"></script>
</body>
</html>

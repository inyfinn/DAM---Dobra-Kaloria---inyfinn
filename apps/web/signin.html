<!doctype html>
<html lang="pl" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>DAM - Dobra Kaloria - Logowanie</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/vendor/css/bootstrap/bootstrap.css">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/dam-tokens.css?v=bust20260720a">
  <link rel="stylesheet" href="./assets/css/dam-app.css?v=pagesub20260721b">
  <link rel="stylesheet" href="./assets/css/dam-brand.css?v=vizCtaNav20260721b">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@iconscout/unicons@4.0.8/css/line.min.css">
  <script>
    if (localStorage.theme) document.documentElement.setAttribute("data-theme", localStorage.theme);
    (function () {
      if (localStorage.getItem("dam_token") && localStorage.getItem("dam_device_id")) {
        location.replace("dashboard.html");
      }
    })();
  </script>
  <style>
    /* Geex authentication anatomy + DAM brand (THEME/signin.html) */
    .dam-auth-mode {
      display: flex;
      gap: 8px;
      margin: 0 0 20px;
    }
    .dam-auth-mode[hidden] {
      display: none !important;
    }
    .dam-auth-mode button {
      flex: 1;
      min-height: 44px;
      border: 1px solid #e7e7e7;
      background: #fff;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--body-color, #464255);
      cursor: pointer;
      transition: border-color .2s ease, color .2s ease, background .2s ease;
    }
    .dam-auth-mode button.is-active {
      border-color: var(--primary-color, #AB54DB);
      color: var(--primary-color, #AB54DB);
      background: rgba(171, 84, 219, 0.06);
    }
    .dam-auth-mode button:focus-visible {
      outline: 2px solid var(--primary-color, #AB54DB);
      outline-offset: 2px;
    }
    .geex-content__authentication__content {
      text-align: left;
    }
    .geex-content__authentication__content__logo {
      display: flex !important;
      justify-content: center;
      align-items: center;
      text-align: center;
      width: 100%;
      min-height: 64px;
      margin: 0 0 28px;
    }
    .geex-content__authentication__content__logo a {
      display: inline-flex !important;
      justify-content: center;
      align-items: center;
      width: auto !important;
      height: auto !important;
      min-height: 56px;
      margin: 0 auto;
    }
    .geex-content__authentication__content__logo img.dam-logo-dk {
      display: block !important;
      margin: 0 auto;
      height: 56px !important;
      width: auto !important;
      max-width: 220px !important;
      max-height: none !important;
      object-fit: contain;
    }
    html:not([data-theme="dark"]) .geex-content__authentication__content__logo .logo-dark {
      display: none !important;
    }
    html[data-theme="dark"] .geex-content__authentication__content__logo .logo-lite {
      display: none !important;
    }
    .geex-content__authentication__title {
      margin: 0 0 10px;
      text-align: center;
      color: var(--dark-color, #17161E);
    }
    .geex-content__authentication__subtitle {
      margin: 0 auto 22px;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.5;
      text-align: center;
      color: var(--dark-color, #17161E);
      max-width: 40ch;
    }
    .geex-content__authentication__form-group label,
    .geex-content__authentication__checkbox-label {
      color: var(--body-color, #464255);
    }
    .geex-content__authentication__form-group input::placeholder {
      color: #7a7688;
      opacity: 1;
    }
    .dam-auth-msg {
      font-size: 13px;
      margin: 12px 0 0;
      min-height: 20px;
      line-height: 1.4;
    }
    .dam-auth-msg.is-err { color: #FF5653; }
    .dam-auth-msg.is-ok { color: #2CBF44; }
    .geex-content__authentication__form-submit {
      min-height: 48px;
      width: 100%;
      cursor: pointer;
    }
    .geex-content__authentication__form-submit:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .geex-content__authentication__form-footer {
      margin-top: 18px;
      font-size: 14px;
      text-align: center;
      text-transform: none;
    }
  </style>
</head>
<body class="geex-dashboard authentication-page dam-app">
  <main class="geex-content">
    <div class="geex-content__authentication">
      <div class="geex-content__authentication__content">
        <div class="geex-content__authentication__content__wrapper">
          <div class="geex-content__authentication__content__logo">
            <a href="dashboard.html" aria-label="DAM - Dobra Kaloria - Inyfinn">
              <img class="logo-lite dam-logo-dk" src="assets/img/logo-dobra-kaloria.svg" alt="Dobra Kaloria">
              <img class="logo-dark dam-logo-dk" src="assets/img/logo-dobra-kaloria.svg" alt="Dobra Kaloria">
            </a>
          </div>

          <form id="damAuthForm" class="geex-content__authentication__form" autocomplete="on">
            <h2 class="geex-content__authentication__title">Witaj w DAM</h2>
            <p class="geex-content__authentication__subtitle">
              Zaloguj się kontem firmowym. Możesz wylogować się w menu użytkownika.
            </p>

            <div class="dam-auth-mode" id="authModeTabs" role="tablist" aria-label="Tryb konta" hidden>
              <button type="button" class="is-active" id="tabLogin" data-tab="login">Zaloguj</button>
              <button type="button" id="tabRegister" data-tab="register">Utworz konto</button>
            </div>

            <div class="geex-content__authentication__form-group" id="nameWrap" hidden>
              <label for="authName">Imie i nazwisko</label>
              <input type="text" id="authName" name="name" placeholder="np. Jan Kowalski" autocomplete="name">
              <i class="uil-user" aria-hidden="true"></i>
            </div>

            <div class="geex-content__authentication__form-group">
              <label for="authEmail">Email</label>
              <input type="email" id="authEmail" name="email" required
                     placeholder="np. imie.nazwisko@firma.pl" autocomplete="username">
              <i class="uil-envelope" aria-hidden="true"></i>
            </div>

            <div class="geex-content__authentication__form-group">
              <div class="geex-content__authentication__label-wrapper">
                <label for="authPassword">Hasło</label>
              </div>
              <input type="password" id="authPassword" name="password" required
                     minlength="4" placeholder="Hasło" autocomplete="current-password">
              <i class="uil-eye toggle-password-type" id="togglePassword" role="button"
                 tabindex="0" aria-label="Pokaż lub ukryj hasło"></i>
            </div>

            <div class="geex-content__authentication__form-group custom-checkbox" id="rememberWrap">
              <input type="checkbox" class="geex-content__authentication__checkbox-input"
                     id="rememberDevice" checked>
              <label class="geex-content__authentication__checkbox-label" for="rememberDevice">
                Zapamiętaj to urządzenie
              </label>
            </div>

            <button type="submit" class="geex-content__authentication__form-submit" id="authSubmit">
              Zaloguj
            </button>
            <p class="dam-auth-msg" id="authMsg" role="status" aria-live="polite"></p>

            <div class="geex-content__authentication__form-footer" id="authFooter">
              Nie masz konta? Poproś administratora o dostęp.
            </div>
          </form>
        </div>
      </div>
      <div class="geex-content__authentication__img">
        <img src="./assets/img/authentication.svg" alt="">
      </div>
    </div>
  </main>

  <script src="./assets/js/main.js"></script>
  <script src="./assets/js/dam-runtime.js?v=20260719auth3"></script>
  <script src="./assets/js/dam-api.js?v=privgate20260721a"></script>
  <script>
    (function () {
      var mode = "login";
      var registrationOpen = false;
      var tabLogin = document.getElementById("tabLogin");
      var tabRegister = document.getElementById("tabRegister");
      var modeTabs = document.getElementById("authModeTabs");
      var nameWrap = document.getElementById("nameWrap");
      var submitBtn = document.getElementById("authSubmit");
      var msg = document.getElementById("authMsg");
      var pass = document.getElementById("authPassword");
      var footer = document.getElementById("authFooter");
      var toggle = document.getElementById("togglePassword");

      function setMode(m) {
        if (m === "register" && !registrationOpen) {
          m = "login";
        }
        mode = m;
        tabLogin.classList.toggle("is-active", m === "login");
        tabRegister.classList.toggle("is-active", m === "register");
        tabLogin.setAttribute("aria-selected", m === "login" ? "true" : "false");
        tabRegister.setAttribute("aria-selected", m === "register" ? "true" : "false");
        nameWrap.hidden = m !== "register";
        pass.autocomplete = m === "register" ? "new-password" : "current-password";
        pass.minLength = m === "register" ? 8 : 4;
        pass.setAttribute("minlength", m === "register" ? "8" : "4");
        submitBtn.textContent = m === "register" ? "Utworz konto" : "Zaloguj";
        if (registrationOpen) {
          footer.innerHTML = m === "register"
            ? 'Masz juz konto? <a href="#" id="switchToLogin">Zaloguj sie</a>'
            : 'Pierwsze uruchomienie: <a href="#" id="switchToRegister">Utworz konto admina</a>';
          var link = footer.querySelector("a");
          if (link) {
            link.addEventListener("click", function (e) {
              e.preventDefault();
              setMode(m === "register" ? "login" : "register");
            });
          }
        } else {
          footer.textContent = "Nie masz konta? Poproś administratora o dostęp.";
        }
        msg.textContent = "";
        msg.className = "dam-auth-msg";
      }

      function applyRegistrationPolicy(open) {
        registrationOpen = !!open;
        modeTabs.hidden = !registrationOpen;
        setMode("login");
      }

      /* Domyslnie produkcja: rejestracja ukryta; bootstrap tylko gdy API mowi open. */
      applyRegistrationPolicy(false);
      try {
        var base = (window.DamRuntime && typeof DamRuntime.bridgeUrl === "function")
          ? DamRuntime.bridgeUrl()
          : "http://127.0.0.1:8766";
        fetch(String(base).replace(/\/$/, "") + "/auth/registration-open", { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data && data.ok && data.open === true) {
              applyRegistrationPolicy(true);
            }
          })
          .catch(function () { /* zostaw ukryte */ });
      } catch (_e) { /* zostaw ukryte */ }

      tabLogin.addEventListener("click", function () { setMode("login"); });
      tabRegister.addEventListener("click", function () { setMode("register"); });

      function flipPassword() {
        var show = pass.type === "password";
        pass.type = show ? "text" : "password";
        toggle.classList.toggle("uil-eye", !show);
        toggle.classList.toggle("uil-eye-slash", show);
      }
      if (toggle) {
        toggle.addEventListener("click", flipPassword);
        toggle.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            flipPassword();
          }
        });
      }

      document.getElementById("damAuthForm").addEventListener("submit", function (e) {
        e.preventDefault();
        if (!window.DamApi) {
          msg.className = "dam-auth-msg is-err";
          msg.textContent = "Brak polaczenia z aplikacja. Uruchom DAM z pulpitu.";
          return;
        }
        if (mode === "register" && !registrationOpen) {
          msg.className = "dam-auth-msg is-err";
          msg.textContent = "Rejestracja publiczna wyłączona. Poproś administratora.";
          return;
        }
        var email = (document.getElementById("authEmail").value || "").trim();
        var password = pass.value || "";
        var name = (document.getElementById("authName").value || "").trim();
        submitBtn.disabled = true;
        msg.className = "dam-auth-msg";
        msg.textContent = mode === "register" ? "Tworzenie konta..." : "Logowanie...";

        var p = mode === "register"
          ? DamApi.register(email, password, name)
          : DamApi.login(email, password);

        p.then(function () {
          msg.className = "dam-auth-msg is-ok";
          msg.textContent = "Zalogowano. Przekierowanie...";
          setTimeout(function () { location.replace("dashboard.html"); }, 300);
        }).catch(function (err) {
          msg.className = "dam-auth-msg is-err";
          msg.textContent = (err && err.message) || "Nie udalo sie zalogowac";
          submitBtn.disabled = false;
        });
      });
    })();
  </script>
</body>
</html>

  <script>
    (function () {
      var intOpts = {
        layout: "bento",
        includeAuthInfra: true,
        includeExtras: true,
        includeSynology: true,
        includeFinance: true,
        prefsJump: "link",
      };
      function bootIntegrations() {
        if (!window.DamIntegrations) return;
        DamIntegrations.mount("damIntegrationsList", intOpts);
      }
      /* Race: DOMContentLoaded może już minąć gdy inline script się rejestruje */
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", bootIntegrations);
      } else {
        bootIntegrations();
      }
      /*
       * NIE remountuj na window "focus" - zamyka <details> Konfiguruj,
       * flashuje skeleton i wygląda jak "przycisk tylko odświeża".
       * Po powrocie z OAuth (inna karta) odśwież tylko gdy brak otwartego panelu.
       */
      var lastVisRefresh = 0;
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState !== "visible") return;
        if (!window.DamIntegrations) return;
        var box = document.getElementById("damIntegrationsList");
        if (
          box &&
          box.querySelector(
            "details[open], .dam-int-form input:focus, .dam-int-form textarea:focus"
          )
        ) {
          return;
        }
        var now = Date.now();
        if (now - lastVisRefresh < 5000) return;
        lastVisRefresh = now;
        DamIntegrations.refresh("damIntegrationsList", intOpts);
      });
    })();
  </script>

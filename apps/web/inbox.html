<!doctype html>
<html lang="pl" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAM ETA - Skrzynka odbiorcza</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/vendor/css/bootstrap/bootstrap.css">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/dam-tokens.css?v=20260718v7f">
  <link rel="stylesheet" href="./assets/css/dam-app.css?v=20260718shell2">
  <link rel="stylesheet" href="./assets/css/dam-brand.css?v=20260718v7f">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@iconscout/unicons@4.0.8/css/line.min.css">
</head>
<body class="geex-dashboard dam-app">
  <div class="dam-sidebar-backdrop" id="damSidebarBackdrop"></div>
  <header class="geex-header">
    <div class="geex-header__wrapper">
      <div class="geex-header__logo-wrapper">
        <a href="index.html" class="geex-header__logo">
          <img class="logo-lite" src="assets/img/logo-dark.svg" alt="DAM ETA" />
          <img class="logo-dark" src="assets/img/logo-lite.svg" alt="DAM ETA" />
        </a>
      </div>
    </div>
  </header>
  <main class="geex-main-content">
    <div class="geex-sidebar" id="damSidebar">
      <a href="#" class="geex-sidebar__close" id="damSidebarClose" aria-label="Zamknij menu"><i class="uil uil-times"></i></a>
      <div class="geex-sidebar__wrapper">
        <nav class="geex-sidebar__menu-wrapper">
          <ul class="geex-sidebar__menu"></ul>
        </nav>
      </div>
    </div>
    <div class="geex-content">
      <div class="geex-content__header">
        <div class="geex-content__header__content">
          <h2 class="geex-content__header__title">Skrzynka odbiorcza</h2>
          <p class="geex-content__header__subtitle">Wszystkie zadania, zgloszenia i wiadomosci w jednym miejscu - filtruj po tagach.</p>
        </div>
      </div>

      <div class="dam-inbox-toolbar">
        <button type="button" class="dam-inbox-tag is-active" data-tag="all">Wszystkie</button>
        <button type="button" class="dam-inbox-tag" data-tag="wizualizacja">Wizualizacja</button>
        <button type="button" class="dam-inbox-tag" data-tag="asana">Asana</button>
        <button type="button" class="dam-inbox-tag" data-tag="teams">Teams</button>
        <button type="button" class="dam-inbox-tag" data-tag="mail">Mail</button>
        <button type="button" class="dam-inbox-tag" data-tag="projekt">Projekt</button>
        <button type="button" class="dam-inbox-tag" data-tag="prywatna">Prywatna</button>
        <span style="flex:1"></span>
        <button type="button" class="geex-btn geex-btn--sm" id="inboxRefresh"><i class="uil uil-refresh"></i> Odswiez</button>
      </div>

      <ul class="dam-inbox-list" id="inboxList">
        <li class="dam-inbox-item"><div class="dam-widget__meta">Wczytywanie...</div></li>
      </ul>
    </div>
  </main>
  <script src="./assets/vendor/js/jquery/jquery-3.5.1.min.js"></script>
  <script src="./assets/vendor/js/bootstrap/bootstrap.min.js"></script>
  <script src="./assets/js/main.js"></script>
  <script src="./assets/js/dam-app.js?v=20260717ux6"></script>
  <script src="./assets/js/dam-api.js?v=20260718auth1"></script>
  <script src="./assets/js/dam-i18n.js?v=20260718shell2"></script>
  <script src="./assets/js/dam-runtime.js?v=20260718app1"></script>
  <script src="./assets/js/dam-shell.js?v=20260718v7f"></script>
  <script src="./assets/js/dam-paths.js?v=20260718btn1"></script>
  <script>
    (function () {
      var activeTag = "all";
      var allItems = [];

      function esc(s) {
        return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function bridgeUrl() {
        return (window.DamPaths && window.DamPaths.bridgeUrl && window.DamPaths.bridgeUrl()) || "http://127.0.0.1:8766";
      }

      function fmtDate(s) {
        if (!s) return "";
        return String(s).replace("T", " ").slice(0, 16);
      }

      function tagPill(t) {
        return '<span class="dam-inbox-item__tag">' + esc(t) + "</span>";
      }

      function render() {
        var list = document.getElementById("inboxList");
        var items = activeTag === "all" ? allItems : allItems.filter(function (it) {
          return (it.tags || []).indexOf(activeTag) !== -1;
        });
        if (!items.length) {
          list.innerHTML = '<li class="dam-inbox-item"><div class="dam-widget__meta">Brak wpisow dla tego filtra.</div></li>';
          return;
        }
        list.innerHTML = items
          .map(function (it) {
            return (
              '<li class="dam-inbox-item' + (it.read === false ? " is-unread" : "") + '">' +
              '<div class="dam-inbox-item__top">' +
              "<strong>" + esc(it.title) + "</strong>" +
              '<span class="dam-inbox-item__date">' + esc(fmtDate(it.created_at || it.date)) + "</span>" +
              "</div>" +
              (it.detail ? '<div class="dam-inbox-item__detail">' + esc(it.detail).replace(/\n/g, "<br>") + "</div>" : "") +
              '<div class="dam-inbox-item__tags">' + (it.tags || []).map(tagPill).join("") + "</div>" +
              "</li>"
            );
          })
          .join("");
      }

      function loadInboxItems() {
        return fetch(bridgeUrl() + "/inbox-items")
          .then(function (r) { return r.json(); })
          .then(function (d) { return d.items || []; })
          .catch(function () { return []; });
      }

      function loadAsanaAsInbox() {
        return fetch("data/asana-tasks.json")
          .then(function (r) { return r.json(); })
          .then(function (d) {
            return (d.tasks || []).filter(function (t) { return t.status === "open"; }).map(function (t) {
              return {
                title: t.name || "Zadanie Asana",
                detail: (t.project || "") + (t.due_on ? " - termin: " + t.due_on : ""),
                tags: ["asana", "projekt"],
                created_at: t.due_on || "",
                read: true,
              };
            });
          })
          .catch(function () { return []; });
      }

      function load() {
        Promise.all([loadInboxItems(), loadAsanaAsInbox()]).then(function (results) {
          allItems = results[0].concat(results[1]);
          allItems.sort(function (a, b) {
            return String(b.created_at || "").localeCompare(String(a.created_at || ""));
          });
          render();
        });
      }

      document.querySelectorAll(".dam-inbox-tag").forEach(function (btn) {
        btn.addEventListener("click", function () {
          document.querySelectorAll(".dam-inbox-tag").forEach(function (b) { b.classList.remove("is-active"); });
          btn.classList.add("is-active");
          activeTag = btn.getAttribute("data-tag");
          render();
        });
      });
      document.getElementById("inboxRefresh").addEventListener("click", load);
      load();
    })();
  </script>
</body>
</html>

<body class="geex-dashboard dam-app">
  <div class="dam-sidebar-backdrop" id="damSidebarBackdrop"></div>
  <header class="geex-header">
    <div class="geex-header__wrapper">
      <div class="geex-header__logo-wrapper">
        <a href="dashboard.html" class="geex-header__logo" title="Dobra Kaloria - DAM">
          <img class="logo-lite dam-logo-dk" src="assets/img/logo-dk-green.svg" alt="Dobra Kaloria" />
          <img class="logo-dark dam-logo-dk" src="assets/img/logo-dk-green.svg" alt="Dobra Kaloria" />
        </a>
        <button type="button" class="geex-btn geex-btn--primary dam-menu-toggle d-lg-none" id="damSidebarToggle" aria-label="Menu">
          <i class="uil uil-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="geex-main-content">
    <div class="geex-sidebar" id="damSidebar">
      <a href="#" class="geex-sidebar__close" id="damSidebarClose" aria-label="Zamknij menu"><i class="uil uil-times"></i></a>
      <div class="geex-sidebar__wrapper">
        <div class="geex-sidebar__header">
          <a href="dashboard.html" class="geex-sidebar__logo" title="Dobra Kaloria - DAM" aria-label="Dobra Kaloria - DAM">
            <img class="logo-lite dam-logo-dk" src="assets/img/logo-dk-green.svg" alt="Dobra Kaloria" width="150" height="48" />
            <img class="logo-dark dam-logo-dk" src="assets/img/logo-dk-green.svg" alt="Dobra Kaloria" width="150" height="48" />
          </a>
        </div>
        <nav class="geex-sidebar__menu-wrapper">
          <ul class="geex-sidebar__menu">
            <li class="geex-sidebar__menu__item active">
              <a href="index.html" class="geex-sidebar__menu__link"><i class="uil uil-folder"></i><span>Projekty</span></a>
            </li>
          </ul>
        </nav>
      </div>
    </div>

    <div class="geex-content">
      <div class="geex-content__header">
        <div class="geex-content__header__content">
          <h2 class="geex-content__header__title">Projekty opakowań</h2>
          <p class="geex-content__header__subtitle dam-page-sub" data-i18n="projects.subtitle">Lista projektów opakowań i ich kompletności plików.</p>
        </div>
      </div>

      <!-- Globalna wyszukiwarka + tagi (zakres: ta podstrona) -->
      <div class="dam-global-search-block">
        <div class="dam-explorer-toolbar dam-projects-toolbar">
          <div class="dam-search-wrap dam-search-wrap--panel">
            <div class="dam-search-input-wrap">
              <i class="uil uil-search" aria-hidden="true"></i>
              <input
                type="text"
                id="damProjectsSearch"
                class="form-control dam-search-input"
                placeholder="Szukaj indeksu lub skojarzenia (np. 6300, czekolada, Krzysztof)"
                autocomplete="off"
                aria-label="Szukaj projektów"
                data-dam-tip="Szuka w liscie projektów na tej stronie"
              />
            </div>
            <div id="damProjectsSearchScope" class="dam-search-scope-mount" aria-label="Zakres wyszukiwania"></div>
          </div>
        </div>
        <div id="damProjectsTags" class="dam-tag-groups" aria-label="Skojarzenia"></div>
      </div>

      <!-- Akcje nad wynikami (biale tlo) - search zostaje pelnej szerokosci -->
      <div class="dam-projects-grid-toolbar">
        <p id="damProjectsStatus" class="dam-page-status dam-projects-status-line" aria-live="polite">Łączenie...</p>
        <div class="dam-projects-grid-toolbar__actions">
          <label class="dam-tag-reveal-toggle" data-dam-tip="Pokazuje info o pakowaniu zbiorczym na kartach produktów (np. 2F, 2×12). Nie dotyczy strony Branding."><input type="checkbox" id="damRevealLowTags" /> Info Pakowania</label>
          <button type="button" class="dam-int-cta" id="damProjectsRefresh" title="Przeładuj listę z bieżącego indeksu (szybkie, bez skanu dysku)" data-dam-tip="Odśwież listę = przeładuj karty z już wczytanego indeksu w pamięci/bridge. Nie skanuje folderów Marketing.">Odśwież listę</button>
          <button type="button" class="dam-int-cta" id="damIngestBtn" title="Przeskanuj foldery Marketing i przebuduj indeks (admin)" data-dam-tip="Skanuj dysk = pełny ingest Marketing: czyta foldery, aktualizuje indeks produktów. Trwa dłużej niż Odśwież listę.">Skanuj dysk</button>
        </div>
      </div>

      <div class="row g-3 g-md-4" id="damProjectsGrid"></div>
    </div>
  </main>

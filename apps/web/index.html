  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>DAM ETA - Projekty</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/vendor/css/bootstrap/bootstrap.css">
  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/dam-tokens.css?v=20260718v7f">
  <link rel="stylesheet" href="./assets/css/dam-app.css?v=20260718ui35f">
  <link rel="stylesheet" href="./assets/css/dam-brand.css?v=20260718userMenu1">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@iconscout/unicons@4.0.8/css/line.min.css">
  <script>
    if (localStorage.theme) document.documentElement.setAttribute("data-theme", localStorage.theme);
  </script>
</head>
<body class="geex-dashboard dam-app">
  <div class="dam-sidebar-backdrop" id="damSidebarBackdrop"></div>
  <header class="geex-header">
    <div class="geex-header__wrapper">
      <div class="geex-header__logo-wrapper">
        <a href="dashboard.html" class="geex-header__logo" title="Dobra Kaloria - DAM ETA">
          <img class="logo-lite dam-logo-dk" src="assets/img/logo-dk-green.svg" alt="Dobra Kaloria" />
          <img class="logo-dark dam-logo-dk" src="assets/img/logo-dk-green.svg" alt="Dobra Kaloria" />
        </a>
        <button type="button" class="geex-btn geex-btn--primary dam-menu-toggle d-lg-none" id="damSidebarToggle" aria-label="Menu">
          <i class="uil uil-bars"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="geex-main-content">
    <div class="geex-sidebar" id="damSidebar">
      <a href="#" class="geex-sidebar__close" id="damSidebarClose" aria-label="Zamknij menu"><i class="uil uil-times"></i></a>
      <div class="geex-sidebar__wrapper">
        <div class="geex-sidebar__header">
          <a href="dashboard.html" class="geex-sidebar__logo" title="Dobra Kaloria - DAM ETA" aria-label="Dobra Kaloria - DAM ETA">
            <img class="logo-lite dam-logo-dk" src="assets/img/logo-dk-green.svg" alt="Dobra Kaloria" width="150" height="48" />
            <img class="logo-dark dam-logo-dk" src="assets/img/logo-dk-green.svg" alt="Dobra Kaloria" width="150" height="48" />
          </a>
        </div>
        <nav class="geex-sidebar__menu-wrapper">
          <ul class="geex-sidebar__menu">
            <li class="geex-sidebar__menu__item active">
              <a href="index.html" class="geex-sidebar__menu__link"><i class="uil uil-folder"></i><span>Projekty</span></a>
            </li>
          </ul>
        </nav>
      </div>
    </div>

    <div class="geex-content">
      <div class="geex-content__header">
        <div class="geex-content__header__content">
          <h2 class="geex-content__header__title">Projekty opakowań</h2>
          <p class="geex-content__header__subtitle dam-page-sub">Lista projektów opakowań i ich kompletności plików.</p>
        </div>
      </div>

      <!-- Globalna wyszukiwarka + tagi (zakres: ta podstrona) -->
      <div class="dam-global-search-block">
        <div class="dam-explorer-toolbar dam-projects-toolbar">
          <div class="dam-search-wrap">
            <div class="dam-search-input-wrap">
              <i class="uil uil-search" aria-hidden="true"></i>
              <input
                type="text"
                id="damProjectsSearch"
                class="form-control dam-search-input"
                placeholder="Szukaj indeksu lub skojarzenia (np. 6300, czekolada, Krzysztof)"
                autocomplete="off"
                aria-label="Szukaj projektów"
                data-dam-tip="Szuka w liscie projektów na tej stronie"
              />
            </div>
          </div>
          <div class="dam-explorer-toolbar__actions">
            <button type="button" class="geex-btn" id="damProjectsRefresh" title="Przeładuj listę z bieżącego indeksu (szybkie, bez skanu dysku)" data-dam-tip="Odśwież listę = przeładuj karty z już wczytanego indeksu w pamięci/bridge. Nie skanuje folderów Marketing.">Odśwież listę</button>
            <button type="button" class="geex-btn geex-btn--primary" id="damIngestBtn" title="Przeskanuj foldery Marketing i przebuduj indeks (admin)" data-dam-tip="Skanuj dysk = pełny ingest Marketing: czyta foldery, aktualizuje indeks produktów. Trwa dłużej niż Odśwież listę.">Skanuj dysk</button>
          </div>
        </div>
        <p id="damProjectsStatus" class="dam-page-status dam-projects-status-line" aria-live="polite">Łączenie...</p>
        <div id="damProjectsTags" class="dam-tag-groups" aria-label="Skojarzenia"></div>
      </div>

      <div class="row g-3 g-md-4" id="damProjectsGrid"></div>
    </div>
  </main>

  <script src="./assets/vendor/js/jquery/jquery-3.5.1.min.js"></script>
  <script src="./assets/vendor/js/bootstrap/bootstrap.min.js"></script>
  <script src="./assets/js/main.js"></script>
  <script src="./assets/js/dam-api.js?v=20260718authRehydrate1"></script>

  <script src="./assets/js/dam-badges.js?v=20260718namePl1"></script>
  <script src="./assets/js/dam-paths.js?v=20260718card7"></script>
  <script src="./assets/js/dam-icons.js?v=20260718icons1"></script>
  <script src="./assets/js/dam-search.js?v=20260718tags1"></script>
  <script src="./assets/js/dam-tag-bar.js?v=20260718tagCase2"></script>
  <script src="./assets/js/dam-projects.js?v=20260718searchPersist1"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl" dir="ltr">
<head>
  <script>(function(){try{var r=document.documentElement,p=localStorage.getItem('dam_theme_pref')||localStorage.getItem('theme')||'light',t=p;if(p==='system'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}if(t!=='dark'&&t!=='light')t='light';r.setAttribute('data-theme',t);r.style.colorScheme=t;}catch(e){}})();</script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>F3 buttons fixture (prod CSS chain)</title>
  <!-- Same font + CSS chain as production DAM pages (Jost). Never bare style.css alone. -->
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/vendor/css/bootstrap/bootstrap.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/dam-tokens.css?v=geexTaste20260721a" />
  <link rel="stylesheet" href="../assets/css/dam-primitives.css?v=ctaUnify20260721b" />
  <link rel="stylesheet" href="../assets/css/dam-app.css?v=ctaUnify20260721b" />
  <link rel="stylesheet" href="../assets/css/dam-brand.css?v=assocDashBr20260722a" />
  <link rel="stylesheet" href="../assets/css/dam-tutorial.css?v=geexF3tutInvite20260804b" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@iconscout/unicons@4.0.8/css/line.min.css" />
  <style>
    html, body {
      margin: 0;
      font-family: var(--dam-font, "Jost", sans-serif) !important;
      background: var(--dam-surface-muted, #f5f6fa);
      color: var(--dam-text, #464255);
    }
    .fixture {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px;
      font-family: inherit;
    }
    h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; font-family: inherit; }
    .note { font-size: 12px; opacity: 0.75; margin: 0 0 20px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 20px; }
    .label { width: 100%; font-size: 12px; font-weight: 600; opacity: 0.7; font-family: inherit; }
    .dam-viz-modal__actions {
      display: flex; flex-wrap: nowrap; align-items: center; gap: 10px;
      padding: 12px; background: var(--dam-surface, #fff);
      border: 1px solid var(--dam-border, #ececf2);
      border-radius: var(--dam-radius-md, 12px);
    }
    button, .geex-btn, .dam-int-cta, .dam-search-scope__btn {
      font-family: inherit !important;
    }
  </style>
</head>
<body class="geex-dashboard dam-app">
  <div class="fixture">
    <h1>Geex buttons fixture</h1>
    <p class="note">Prod CSS chain + Jost. Compare to explorer / branding / dashboard - not a redesign sandbox.</p>

    <div class="row">
      <div class="label">CTA (Geex)</div>
      <button type="button" class="geex-btn geex-btn--primary" id="btnPrimary">Primary</button>
      <button type="button" class="geex-btn geex-btn--secondary" id="btnSecondary">Secondary</button>
      <button type="button" class="geex-btn geex-btn--danger" id="btnDanger">Danger</button>
      <button type="button" class="geex-btn geex-btn--ghost" id="btnGhost">Ghost</button>
      <button type="button" class="geex-btn dam-win-btn" id="btnWin">Win alias</button>
      <button type="button" class="dam-btn-primary" id="btnDamPrimary">dam-btn-primary</button>
    </div>

    <div class="row">
      <div class="label">Loved product aliases (pad unified via tokens)</div>
      <button type="button" class="geex-btn geex-btn--sm dam-lifecycle-history__open">Historia statusow</button>
      <button type="button" class="dam-int-cta">Sprawdz projekt</button>
      <button type="button" class="dam-int-cta">Przejdz</button>
      <button type="button" class="geex-btn geex-btn--primary dam-branding-preview-btn">Podglad</button>
      <button type="button" class="dam-search-scope__btn is-on">Wszystko</button>
      <button type="button" class="dam-search-scope__btn">Produkty</button>
    </div>

    <div class="row">
      <div class="label">Icon 44</div>
      <button type="button" class="dam-icon-btn" id="btnIcon" aria-label="icon"><i class="uil uil-star"></i></button>
      <button type="button" class="dam-viz-icon-btn" id="btnVizIcon" aria-label="viz"><i class="uil uil-folder"></i></button>
    </div>

    <div class="row">
      <div class="label">Tutorial alias</div>
      <button type="button" class="dam-tut__btn" id="btnTut">Dalej</button>
      <button type="button" class="dam-tut__btn dam-tut__btn--primary" id="btnTutPrimary">Start</button>
    </div>

    <div class="row dam-viz-modal__actions" id="actionsRow">
      <div class="dam-viz-modal__actions-main" style="display:flex;gap:10px;align-items:center">
        <button type="button" class="geex-btn geex-btn--primary">Zapisz</button>
        <button type="button" class="geex-btn dam-win-btn">Folder</button>
      </div>
      <button type="button" class="dam-viz-icon-btn" aria-label="more"><i class="uil uil-ellipsis-h"></i></button>
    </div>
  </div>
</body>
</html>

# OPCJONALNE / DEV ONLY - NIE dla uzytkownika koncowego DAM ETA.
# Uzytkownik: SQLite w apps/desktop/data (ADR-007) - startuje z launch.py.
# Ten plik zostawiony tylko gdy ktos celowo testuje Laravel+Postgres.
services:
  postgres:
    image: postgres:16-alpine
    profiles: ["dev-postgres"]
    container_name: dam-eta-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: dam
      POSTGRES_PASSWORD: dam_eta_local
      POSTGRES_DB: dam_eta
    volumes:
      - ./data/postgres-docker:/var/lib/postgresql/data

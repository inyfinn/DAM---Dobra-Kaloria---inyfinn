  <style>
    /* Geex authentication anatomy + DAM brand (THEME/signin.html) */
    .dam-auth-mode {
      display: flex;
      gap: 8px;
      margin: 0 0 20px;
    }
    .dam-auth-mode[hidden] {
      display: none !important;
    }
    .dam-auth-mode button {
      flex: 1;
      min-height: 44px;
      border: 1px solid #e7e7e7;
      background: #fff;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--body-color, #464255);
      cursor: pointer;
      transition: border-color .2s ease, color .2s ease, background .2s ease;
    }
    .dam-auth-mode button.is-active {
      border-color: var(--primary-color, #AB54DB);
      color: var(--primary-color, #AB54DB);
      background: rgba(171, 84, 219, 0.06);
    }
    .dam-auth-mode button:focus-visible {
      outline: 2px solid var(--primary-color, #AB54DB);
      outline-offset: 2px;
    }
    .geex-content__authentication__content {
      text-align: left;
    }
    .geex-content__authentication__content__logo {
      display: flex !important;
      justify-content: center;
      align-items: center;
      text-align: center;
      width: 100%;
      min-height: 64px;
      margin: 0 0 28px;
    }
    .geex-content__authentication__content__logo a {
      display: inline-flex !important;
      justify-content: center;
      align-items: center;
      width: auto !important;
      height: auto !important;
      min-height: 56px;
      margin: 0 auto;
    }
    .geex-content__authentication__content__logo img.dam-logo-dk {
      display: block !important;
      margin: 0 auto;
      height: 56px !important;
      width: auto !important;
      max-width: 220px !important;
      max-height: none !important;
      object-fit: contain;
    }
    html:not([data-theme="dark"]) .geex-content__authentication__content__logo .logo-dark {
      display: none !important;
    }
    html[data-theme="dark"] .geex-content__authentication__content__logo .logo-lite {
      display: none !important;
    }
    .geex-content__authentication__title {
      margin: 0 0 10px;
      text-align: center;
      color: var(--dark-color, #17161E);
    }
    .geex-content__authentication__subtitle {
      margin: 0 auto 22px;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.5;
      text-align: center;
      color: var(--dark-color, #17161E);
      max-width: 40ch;
    }
    .geex-content__authentication__form-group label,
    .geex-content__authentication__checkbox-label {
      color: var(--body-color, #464255);
    }
    .geex-content__authentication__form-group input::placeholder {
      color: #7a7688;
      opacity: 1;
    }
    /* Komunikat NAD przyciskiem: wrapper formularza przewija sie wewnetrznie, a blad pod
       przyciskiem lądowal poza ekranem (800 px wysokosci okna). */
    .dam-auth-msg {
      font-size: 13px;
      margin: 4px 0 12px;
      min-height: 20px;
      line-height: 1.4;
    }
    .dam-auth-msg:empty { min-height: 0; margin: 0; }
    .dam-auth-msg.is-err { color: var(--dam-danger, #ff5b5b); }
    .dam-auth-msg.is-ok { color: var(--dam-ok, #00b074); }
    .dam-auth-hint {
      margin: 0 0 14px;
      font-size: 13px;
      line-height: 1.4;
      color: var(--dam-text-muted, #6B6B6B);
    }
    .dam-auth-hint[hidden] { display: none !important; }
    /* Stan bazy PRZED logowaniem: kropka + tekst + akcja (A3, 06.10.2026) */
    .dam-signin-db {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
      margin: 0 0 18px;
      padding: 10px 14px;
      border: 1px solid var(--dam-border, #E4E6E4);
      border-radius: var(--dam-radius-md, 12px);
      background: var(--dam-surface-muted, #F6F7F6);
      font-size: 13px;
      line-height: 1.4;
      color: var(--dam-text, #222222);
    }
    .dam-signin-db__dot {
      flex: 0 0 auto;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--dam-text-muted, #6B6B6B);
    }
    .dam-signin-db[data-state="online"] .dam-signin-db__dot { background: var(--dam-ok, #00b074); }
    .dam-signin-db[data-state="local"] .dam-signin-db__dot { background: var(--dam-warn, #ffbb54); }
    .dam-signin-db[data-state="offline"] .dam-signin-db__dot,
    .dam-signin-db[data-state="bridge_down"] .dam-signin-db__dot,
    .dam-signin-db[data-state="not_activated"] .dam-signin-db__dot { background: var(--dam-danger, #ff5b5b); }
    .dam-signin-db[data-state="checking"] .dam-signin-db__dot { animation: dam-db-pulse 1s ease-in-out infinite; }
    @keyframes dam-db-pulse { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      .dam-signin-db[data-state="checking"] .dam-signin-db__dot { animation: none; }
    }
    .dam-signin-db__text { flex: 1 1 14em; min-width: 0; overflow-wrap: anywhere; }
    .dam-signin-db__action {
      flex: 0 0 auto;
      min-height: 36px;
      padding: 0 14px;
      border-radius: var(--dam-radius-sm, 8px);
      border: 1px solid var(--dam-primary, #007936);
      background: transparent;
      color: var(--dam-primary, #007936);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .dam-signin-db__action[hidden] { display: none !important; }
    .dam-saved-logins__go:disabled { opacity: .5; cursor: not-allowed; }
    /* Okno ~800 px: wrapper formularza przewija sie wewnetrznie bez paska, wiec zaciesnij
       pionowe odstepy - wiersz stanu bazy i zakladki dodaly ~125 px. */
    @media (max-height: 880px) {
      .geex-content__authentication .geex-content__authentication__content {
        padding-top: 14px;
        padding-bottom: 14px;
      }
      .geex-content__authentication__content__logo {
        min-height: 0;
        margin-bottom: 12px;
      }
      .geex-content__authentication__content__logo img.dam-logo-dk { height: 48px !important; }
      .geex-content__authentication__subtitle { margin-bottom: 14px; }
      .dam-signin-db { margin-bottom: 12px; }
      .dam-auth-mode { margin-bottom: 12px; }
    }
    /* Rejestracja: opcje zapamietywania dotycza tylko logowania */
    #damAuthForm[data-mode="register"] #rememberWrap,
    #damAuthForm[data-mode="register"] #saveLoginWrap,
    #damAuthForm[data-mode="register"] #autologinWrap { display: none !important; }
    .geex-content__authentication__form-submit {
      min-height: 48px;
      width: 100%;
      cursor: pointer;
    }
    .geex-content__authentication__form-submit:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .geex-content__authentication__form-footer {
      margin-top: 18px;
      font-size: 14px;
      text-align: center;
      text-transform: none;
    }
    /* Geex .form-group { display:flex } wygrywa nad atrybutem hidden - login bez imienia */
    #nameWrap[hidden],
    #nameWrap.dam-auth-hidden {
      display: none !important;
    }
    #autologinWrap[hidden] {
      display: none !important;
    }
    /* Zapisane konta - jak w przegladarce: kafelki nad formularzem */
    .dam-saved-logins {
      /* Ta sama szerokosc i os co formularz logowania (460 px, wysrodkowany) -
         bez tego lista rozlewala sie na cala lewa kolumne. */
      width: 100%;
      max-width: 460px;
      margin: 0 auto 20px;
    }
    .dam-saved-logins[hidden] {
      display: none !important;
    }
    .dam-saved-logins__label {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--dam-text-muted, #6f6b7c);
    }
    .dam-saved-logins__list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .dam-saved-logins__item {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--dam-border, #e7e7e7);
      border-radius: 10px;
      background: var(--dam-surface-muted, #fafafa);
      padding: 8px 8px 8px 12px;
    }
    .dam-saved-logins__id {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      border: 0;
      background: transparent;
      padding: 4px 0;
      cursor: pointer;
      text-align: left;
    }
    .dam-saved-logins__name {
      font-size: 13px;
      font-weight: 600;
      color: var(--dam-text, #464255);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dam-saved-logins__email {
      font-size: 12px;
      color: var(--dam-text-muted, #6f6b7c);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dam-saved-logins__go {
      flex: 0 0 auto;
      min-height: 36px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid var(--dam-primary, #AB54DB);
      background: transparent;
      color: var(--dam-primary, #AB54DB);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .dam-saved-logins__go:hover {
      background: color-mix(in srgb, var(--dam-primary, #AB54DB) 10%, transparent);
    }
    .dam-saved-logins__remove {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--dam-text-muted, #6f6b7c);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }
    .dam-saved-logins__remove:hover {
      border-color: var(--dam-danger, #ff5b5b);
      color: var(--dam-danger, #ff5b5b);
      background: color-mix(in srgb, var(--dam-danger, #ff5b5b) 8%, transparent);
    }
    /* Pasek autologowania - 2 s na anulowanie */
    .dam-autologin-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 20px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--dam-primary, #AB54DB);
      background: color-mix(in srgb, var(--dam-primary, #AB54DB) 8%, transparent);
      font-size: 13px;
      color: var(--dam-text, #464255);
    }
    .dam-autologin-bar[hidden] {
      display: none !important;
    }
    .dam-autologin-bar__cancel {
      flex: 0 0 auto;
      min-height: 32px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--dam-border, #e7e7e7);
      background: var(--dam-surface, #fff);
      color: var(--dam-text, #464255);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>

<body class="geex-dashboard authentication-page dam-app">
  <main class="geex-content">
    <div class="geex-content__authentication">
      <div class="geex-content__authentication__content">
        <div class="geex-content__authentication__content__wrapper">
          <div class="geex-content__authentication__content__logo">
            <a href="dashboard.html" aria-label="DAM - Dobra Kaloria - Inyfinn">
              <img class="logo-lite dam-logo-dk" src="assets/img/logo-dobra-kaloria.svg" alt="Dobra Kaloria">
              <img class="logo-dark dam-logo-dk" src="assets/img/logo-dobra-kaloria.svg" alt="Dobra Kaloria">
            </a>
          </div>

          <div id="damSavedLoginsList" class="dam-saved-logins" hidden></div>
          <div id="damAutologinBar" class="dam-autologin-bar" hidden role="status" aria-live="polite">
            <span id="damAutologinText"></span>
            <button type="button" class="dam-autologin-bar__cancel" id="damAutologinCancel">Anuluj</button>
          </div>

          <form id="damAuthForm" class="geex-content__authentication__form" autocomplete="on">
            <h2 class="geex-content__authentication__title">Witaj w DAM</h2>
            <p class="geex-content__authentication__subtitle">
              Zaloguj się kontem firmowym. Możesz wylogować się w menu użytkownika.
            </p>

            <div class="dam-signin-db" id="damDbStatus" role="status" aria-live="polite" data-state="checking">
              <span class="dam-signin-db__dot" aria-hidden="true"></span>
              <span class="dam-signin-db__text" id="damDbStatusText">Baza: sprawdzanie połączenia...</span>
              <button type="button" class="dam-signin-db__action" id="damDbRetry" hidden>Sprawdź ponownie</button>
              <button type="button" class="dam-signin-db__action" id="damDbActivate" hidden>Wpisz kod aktywacyjny</button>
            </div>

            <div class="dam-auth-mode" id="authModeTabs" role="tablist" aria-label="Tryb konta" hidden>
              <button type="button" class="is-active" id="tabLogin" data-tab="login">Zaloguj</button>
              <button type="button" id="tabRegister" data-tab="register">Utwórz konto</button>
            </div>

            <div class="geex-content__authentication__form-group dam-auth-hidden" id="nameWrap" hidden>
              <label for="authName">Imie i nazwisko</label>
              <input type="text" id="authName" name="name" placeholder="np. Jan Kowalski" autocomplete="name">
              <i class="uil-user" aria-hidden="true"></i>
            </div>

            <div class="geex-content__authentication__form-group">
              <label for="authEmail">Email</label>
              <input type="email" id="authEmail" name="email" required
                     placeholder="np. imie.nazwisko@firma.pl" autocomplete="username">
              <i class="uil-envelope" aria-hidden="true"></i>
            </div>

            <div class="geex-content__authentication__form-group">
              <div class="geex-content__authentication__label-wrapper">
                <label for="authPassword">Hasło</label>
              </div>
              <input type="password" id="authPassword" name="password" required
                     minlength="4" placeholder="Hasło" autocomplete="current-password">
              <i class="uil-eye toggle-password-type" id="togglePassword" role="button"
                 tabindex="0" aria-label="Pokaż lub ukryj hasło"></i>
            </div>
            <p class="dam-auth-hint" id="authHint" hidden>
              Hasło: co najmniej 10 znaków, nie może być oczywiste (np. „haslo12345”). Konto dostaje rolę „user”.
            </p>

            <div class="geex-content__authentication__form-group custom-checkbox" id="rememberWrap">
              <input type="checkbox" class="geex-content__authentication__checkbox-input"
                     id="rememberDevice" checked>
              <label class="geex-content__authentication__checkbox-label" for="rememberDevice">
                Zapamiętaj to urządzenie
              </label>
            </div>

            <div class="geex-content__authentication__form-group custom-checkbox" id="saveLoginWrap">
              <input type="checkbox" class="geex-content__authentication__checkbox-input"
                     id="saveLoginDevice" checked>
              <label class="geex-content__authentication__checkbox-label" for="saveLoginDevice">
                Zapisz hasło na tym komputerze
              </label>
            </div>

            <div class="geex-content__authentication__form-group custom-checkbox" id="autologinWrap">
              <input type="checkbox" class="geex-content__authentication__checkbox-input"
                     id="autologinDevice">
              <label class="geex-content__authentication__checkbox-label" for="autologinDevice">
                Loguj automatycznie przy starcie
              </label>
            </div>

            <p class="dam-auth-msg" id="authMsg" role="status" aria-live="polite"></p>
            <button type="submit" class="geex-content__authentication__form-submit" id="authSubmit">
              Zaloguj
            </button>

            <div class="geex-content__authentication__form-footer" id="authFooter">
              Nie masz konta? Założysz je, gdy baza będzie połączona.
            </div>
          </form>
        </div>
      </div>
      <div class="geex-content__authentication__img">
          <img src="./assets/img/auth/kubara-building.jpg"
               alt="Budynek siedziby Kubara w Konstancinie-Jeziornie"
               width="1200" height="1600"
               decoding="async">
      </div>
    </div>

  <script>
    (function () {
      var mode = "login";
      var registrationOpen = false;
      var dbState = "checking";      /* checking | online | local | offline | not_activated | bridge_down */
      var busy = false;
      var form = document.getElementById("damAuthForm");
      var tabLogin = document.getElementById("tabLogin");
      var tabRegister = document.getElementById("tabRegister");
      var modeTabs = document.getElementById("authModeTabs");
      var nameWrap = document.getElementById("nameWrap");
      var submitBtn = document.getElementById("authSubmit");
      var msg = document.getElementById("authMsg");
      var pass = document.getElementById("authPassword");
      var footer = document.getElementById("authFooter");
      var toggle = document.getElementById("togglePassword");
      var hint = document.getElementById("authHint");
      var dbBox = document.getElementById("damDbStatus");
      var dbText = document.getElementById("damDbStatusText");
      var dbRetry = document.getElementById("damDbRetry");
      var dbActivate = document.getElementById("damDbActivate");

      var DB_TEXT = {
        checking: "Baza: sprawdzanie połączenia...",
        online: "Baza: połączono",
        local: "Baza: tryb lokalny (bez centralnej bazy) - konta tylko z tego komputera",
        offline: "Baza: brak połączenia - sprawdź sieć lub VPN i spróbuj ponownie. Logowanie jest wyłączone, dopóki baza nie odpowiada.",
        not_activated: "Baza: aplikacja nie jest aktywowana - wpisz kod aktywacyjny od administratora.",
        bridge_down: "Aplikacja: brak połączenia z mostem DAM (port 8766) - uruchom DAM z pulpitu i spróbuj ponownie."
      };

      /* Logowanie/rejestracja tylko, gdy baza odpowiada (albo swiadomie tryb lokalny). */
      function canSubmit() {
        return dbState === "online" || dbState === "local";
      }

      function applyGate() {
        submitBtn.disabled = busy || !canSubmit();
        var go = document.querySelectorAll(".dam-saved-logins__go");
        for (var i = 0; i < go.length; i++) go[i].disabled = busy || !canSubmit();
      }

      function setBusy(b) {
        busy = !!b;
        applyGate();
      }

      function renderDb() {
        dbBox.setAttribute("data-state", dbState);
        dbText.textContent = DB_TEXT[dbState] || DB_TEXT.checking;
        dbRetry.hidden = !(dbState === "offline" || dbState === "bridge_down");
        dbActivate.hidden = dbState !== "not_activated";
        applyGate();
      }

      function renderFooter() {
        if (registrationOpen) {
          footer.innerHTML = mode === "register"
            ? 'Masz już konto? <a href="#" id="switchToLogin">Zaloguj się</a>'
            : 'Nie masz konta? <a href="#" id="switchToRegister">Utwórz konto</a>';
          var link = footer.querySelector("a");
          if (link) {
            link.addEventListener("click", function (e) {
              e.preventDefault();
              setMode(mode === "register" ? "login" : "register");
            });
          }
        } else if (dbState === "local") {
          footer.textContent = "Nie masz konta? Konta zakłada się przy połączeniu z centralną bazą.";
        } else {
          footer.textContent = "Nie masz konta? Założysz je, gdy baza będzie połączona.";
        }
      }

      function setMode(m) {
        if (m === "register" && !registrationOpen) {
          m = "login";
        }
        mode = m;
        form.setAttribute("data-mode", m);
        tabLogin.classList.toggle("is-active", m === "login");
        tabRegister.classList.toggle("is-active", m === "register");
        tabLogin.setAttribute("aria-selected", m === "login" ? "true" : "false");
        tabRegister.setAttribute("aria-selected", m === "register" ? "true" : "false");
        nameWrap.hidden = m !== "register";
        nameWrap.classList.toggle("dam-auth-hidden", m !== "register");
        hint.hidden = m !== "register";
        pass.autocomplete = m === "register" ? "new-password" : "current-password";
        /* Logowanie przyjmuje stare krotkie hasla (most wymusi zmiane); nowe konto: min. 10. */
        pass.minLength = m === "register" ? 10 : 4;
        pass.setAttribute("minlength", m === "register" ? "10" : "4");
        submitBtn.textContent = m === "register" ? "Utwórz konto" : "Zaloguj";
        renderFooter();
        msg.textContent = "";
        msg.className = "dam-auth-msg";
      }

      function setRegistrationOpen(open) {
        registrationOpen = !!open;
        modeTabs.hidden = !registrationOpen;
        if (!registrationOpen && mode === "register") {
          setMode("login");
        } else {
          renderFooter();
        }
      }

      function bridgeBase() {
        var base = (window.DamRuntime && typeof DamRuntime.bridgeUrl === "function")
          ? DamRuntime.bridgeUrl()
          : "http://127.0.0.1:8766";
        return String(base).replace(/\/$/, "");
      }

      /* Rejestracja otwarta = most mowi "open" (zywa centralna baza). Brak odpowiedzi = zamknieta. */
      function refreshRegistration() {
        if (dbState !== "online") {
          setRegistrationOpen(false);
          return Promise.resolve();
        }
        return fetch(bridgeBase() + "/auth/registration-open", { cache: "no-store" })
          .then(function (r) { return r.json(); })
          .then(function (data) { setRegistrationOpen(!!(data && data.ok && data.open === true)); })
          .catch(function () { setRegistrationOpen(false); });
      }

      var checkInFlight = null;
      /* Stan bazy z timeoutem - zawieszony most nie moze zablokowac ekranu na zawsze. */
      function checkDb() {
        if (checkInFlight) return checkInFlight;
        if (!window.DamApi || typeof DamApi.dbState !== "function") {
          dbState = "bridge_down";
          renderDb();
          return Promise.resolve(dbState);
        }
        var timeout = new Promise(function (resolve) {
          setTimeout(function () { resolve({ state: "bridge_down" }); }, 7000);
        });
        checkInFlight = Promise.race([DamApi.dbState(), timeout])
          .catch(function () { return { state: "bridge_down" }; })
          .then(function (res) {
            dbState = (res && res.state) || "bridge_down";
            renderDb();
            return refreshRegistration().then(function () { return dbState; });
          })
          .then(function (st) { checkInFlight = null; return st; }, function (e) { checkInFlight = null; throw e; });
        return checkInFlight;
      }

      dbRetry.addEventListener("click", function () {
        dbState = "checking";
        renderDb();
        checkDb();
      });
      dbActivate.addEventListener("click", function () {
        if (window.DamActivation && typeof DamActivation.show === "function") {
          DamActivation.show("not_activated");
        }
      });

      renderDb();
      setMode("login");
      checkDb();
      /* Odpytuj czesciej, gdy brak polaczenia (wrocilo = od razu odblokuj), rzadziej gdy jest dobrze. */
      (function schedule() {
        setTimeout(function () {
          if (!document.hidden && !busy) checkDb().then(schedule, schedule);
          else schedule();
        }, canSubmit() ? 20000 : 4000);
      })();

      /* Zapisane konta renderuja sie pozniej - dociagnij blokade przyciskow "Zaloguj". */
      var savedList = document.getElementById("damSavedLoginsList");
      if (savedList && window.MutationObserver) {
        new MutationObserver(applyGate).observe(savedList, { childList: true });
      }

      tabLogin.addEventListener("click", function () { setMode("login"); });
      tabRegister.addEventListener("click", function () { setMode("register"); });

      function flipPassword() {
        var show = pass.type === "password";
        pass.type = show ? "text" : "password";
        toggle.classList.toggle("uil-eye", !show);
        toggle.classList.toggle("uil-eye-slash", show);
      }
      if (toggle) {
        toggle.addEventListener("click", flipPassword);
        toggle.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            flipPassword();
          }
        });
      }

      /* --- Zapisz haslo / autologowanie na tym komputerze --- */
      var saveLoginChk = document.getElementById("saveLoginDevice");
      var autologinChk = document.getElementById("autologinDevice");
      var autologinWrap = document.getElementById("autologinWrap");

      function syncAutologinVisibility() {
        var show = !!(saveLoginChk && saveLoginChk.checked);
        if (autologinWrap) autologinWrap.hidden = !show;
        if (!show && autologinChk) autologinChk.checked = false;
      }
      if (saveLoginChk) {
        saveLoginChk.addEventListener("change", syncAutologinVisibility);
      }
      syncAutologinVisibility();

      function loginOptsFromForm(extra) {
        var save = !!(saveLoginChk && saveLoginChk.checked);
        return Object.assign(
          {
            saveLogin: save,
            autologin: save && !!(autologinChk && autologinChk.checked),
          },
          extra || {}
        );
      }

      /*
       * Obsluga wyniku logowania - WSPOLNA dla formularza (submit) i dla
       * zapisanych kont (dam-saved-logins.js -> mountSignin onResult), zeby nie
       * duplikowac logiki sukcesu / password_change_required / komunikatow bledow.
       */
      function handleAuthSuccess() {
        msg.className = "dam-auth-msg is-ok";
        msg.textContent = mode === "register" ? "Konto utworzone. Przekierowanie..." : "Zalogowano. Przekierowanie...";
        setTimeout(function () { location.replace("dashboard.html"); }, 300);
      }

      /* Kazda przyczyna ma wlasny tekst (DamApi.AUTH_MESSAGES); zapisane konto: ta sama mapa. */
      function errorText(err, ctx) {
        if (err && err.code && window.DamApi && typeof DamApi.authMessage === "function") {
          if (ctx.savedLogin) return DamApi.authMessage(err.code, {}, { saved: true });
          return err.message || DamApi.authMessage(err.code, {}, {});
        }
        return (err && err.message) || "Nie udało się zalogować. Spróbuj ponownie.";
      }

      function handleAuthError(err, ctx) {
        ctx = ctx || {};
        setBusy(false);
        /* Logowanie zwyklym formularzem znamy haslo - mozna otworzyc zmiane hasla. */
        if (err && err.code === "password_change_required" && window.DamPasswordChange && !ctx.savedLogin) {
          msg.className = "dam-auth-msg";
          msg.textContent = "";
          DamPasswordChange.open(
            ctx.email,
            ctx.password,
            function (newPassword) {
              pass.value = newPassword;
              form.requestSubmit();
            },
            {
              onSkip: err.canSkip
                ? function () {
                    return DamApi.login(ctx.email, ctx.password, loginOptsFromForm({ skipPasswordChange: true }))
                      .then(handleAuthSuccess);
                  }
                : null,
            }
          );
          return;
        }
        /* Zapisane konto: haslo nie jest znane w tej karcie (zaszyfrowane po stronie mostu) -
           nie da sie otworzyc zmiany hasla bez niego. Kieruj do zwyklego logowania. */
        if (err && err.code === "password_change_required" && ctx.savedLogin) {
          msg.className = "dam-auth-msg is-err";
          msg.textContent = "To hasło wymaga zmiany. Zaloguj się ręcznie poniżej.";
          document.getElementById("authEmail").value = ctx.email || "";
          pass.value = "";
          pass.focus();
          return;
        }
        if (err && err.code === "not_activated" && ctx.savedLogin && window.DamActivation) {
          try { DamActivation.show("not_activated"); } catch (_a) { /* komunikat i tak wyjdzie */ }
        }
        msg.className = "dam-auth-msg is-err";
        msg.textContent = errorText(err, ctx);
        if (msg.scrollIntoView) msg.scrollIntoView({ block: "nearest" });
        /* Baza/most mogly wlasnie paść - odswiez kropke, zeby status nie klamal. */
        if (err && (err.code === "db_offline" || err.code === "bridge_unreachable" || err.code === "db_not_central" || !err.code)) {
          checkDb();
        }
      }

      /* --- Zapisane konta + autologowanie (dam-saved-logins.js) --- */
      if (window.DamSavedLogins) {
        DamSavedLogins.mountSignin({
          listEl: document.getElementById("damSavedLoginsList"),
          autoBarEl: document.getElementById("damAutologinBar"),
          autoTextEl: document.getElementById("damAutologinText"),
          autoCancelEl: document.getElementById("damAutologinCancel"),
          onFillEmail: function (email) {
            document.getElementById("authEmail").value = email;
            pass.focus();
          },
          onResult: function (promise, ctx) {
            msg.className = "dam-auth-msg";
            msg.textContent = "Logowanie...";
            setBusy(true);
            return promise.then(handleAuthSuccess).catch(function (err) {
              handleAuthError(err, Object.assign({ savedLogin: true }, ctx || {}));
            });
          },
        });
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (!window.DamApi) {
          msg.className = "dam-auth-msg is-err";
          msg.textContent = "Brak połączenia z aplikacją. Uruchom DAM z pulpitu.";
          return;
        }
        if (mode === "register" && !registrationOpen) {
          msg.className = "dam-auth-msg is-err";
          msg.textContent = "Konto można założyć tylko przy połączeniu z bazą. Spróbuj za chwilę.";
          return;
        }
        var email = (document.getElementById("authEmail").value || "").trim();
        var password = pass.value || "";
        var name = (document.getElementById("authName").value || "").trim();
        setBusy(true);
        msg.className = "dam-auth-msg";
        msg.textContent = "Sprawdzanie bazy...";

        /* Najpierw baza: haslo idzie do mostu dopiero, gdy baza odpowiada. */
        checkDb().then(function (st) {
          if (st !== "online" && st !== "local") {
            setBusy(false);
            msg.className = "dam-auth-msg is-err";
            msg.textContent = DB_TEXT[st] || DB_TEXT.offline;
            return null;
          }
          msg.textContent = mode === "register" ? "Tworzenie konta..." : "Logowanie...";
          var p = mode === "register"
            ? DamApi.register(email, password, name, { selfRegister: true })
            : DamApi.login(email, password, loginOptsFromForm());
          return p.then(handleAuthSuccess).catch(function (err) {
            handleAuthError(err, { savedLogin: false, email: email, password: password });
          });
        });
      });
    })();
  </script>
</body>
</html>

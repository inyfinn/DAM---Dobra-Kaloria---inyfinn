  <script>
    if (localStorage.theme) { document.documentElement.setAttribute("data-theme", localStorage.theme); document.documentElement.classList.toggle("dark", localStorage.theme==="dark"); }
    (function () {
      if (localStorage.getItem("dam_token") && localStorage.getItem("dam_device_id")) {
        location.replace("dashboard.html");
      }
    })();
  </script>
  <style>
    /* Geex authentication anatomy + DAM brand (THEME/signin.html) */
    .dam-auth-mode {
      display: flex;
      gap: 8px;
      margin: 0 0 20px;
    }
    .dam-auth-mode[hidden] {
      display: none !important;
    }
    .dam-auth-mode button {
      flex: 1;
      min-height: 44px;
      border: 1px solid #e7e7e7;
      background: #fff;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--body-color, #464255);
      cursor: pointer;
      transition: border-color .2s ease, color .2s ease, background .2s ease;
    }
    .dam-auth-mode button.is-active {
      border-color: var(--primary-color, #AB54DB);
      color: var(--primary-color, #AB54DB);
      background: rgba(171, 84, 219, 0.06);
    }
    .dam-auth-mode button:focus-visible {
      outline: 2px solid var(--primary-color, #AB54DB);
      outline-offset: 2px;
    }
    .geex-content__authentication__content {
      text-align: left;
    }
    .geex-content__authentication__content__logo {
      display: flex !important;
      justify-content: center;
      align-items: center;
      text-align: center;
      width: 100%;
      min-height: 64px;
      margin: 0 0 28px;
    }
    .geex-content__authentication__content__logo a {
      display: inline-flex !important;
      justify-content: center;
      align-items: center;
      width: auto !important;
      height: auto !important;
      min-height: 56px;
      margin: 0 auto;
    }
    .geex-content__authentication__content__logo img.dam-logo-dk {
      display: block !important;
      margin: 0 auto;
      height: 56px !important;
      width: auto !important;
      max-width: 220px !important;
      max-height: none !important;
      object-fit: contain;
    }
    html:not([data-theme="dark"]) .geex-content__authentication__content__logo .logo-dark {
      display: none !important;
    }
    html[data-theme="dark"] .geex-content__authentication__content__logo .logo-lite {
      display: none !important;
    }
    .geex-content__authentication__title {
      margin: 0 0 10px;
      text-align: center;
      color: var(--dark-color, #17161E);
    }
    .geex-content__authentication__subtitle {
      margin: 0 auto 22px;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.5;
      text-align: center;
      color: var(--dark-color, #17161E);
      max-width: 40ch;
    }
    .geex-content__authentication__form-group label,
    .geex-content__authentication__checkbox-label {
      color: var(--body-color, #464255);
    }
    .geex-content__authentication__form-group input::placeholder {
      color: #7a7688;
      opacity: 1;
    }
    .dam-auth-msg {
      font-size: 13px;
      margin: 12px 0 0;
      min-height: 20px;
      line-height: 1.4;
    }
    .dam-auth-msg.is-err { color: #FF5653; }
    .dam-auth-msg.is-ok { color: #2CBF44; }
    .geex-content__authentication__form-submit {
      min-height: 48px;
      width: 100%;
      cursor: pointer;
    }
    .geex-content__authentication__form-submit:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .geex-content__authentication__form-footer {
      margin-top: 18px;
      font-size: 14px;
      text-align: center;
      text-transform: none;
    }
    /* Geex .form-group { display:flex } wygrywa nad atrybutem hidden — login bez imienia */
    #nameWrap[hidden],
    #nameWrap.dam-auth-hidden {
      display: none !important;
    }
    #autologinWrap[hidden] {
      display: none !important;
    }
    /* Zapisane konta - jak w przegladarce: kafelki nad formularzem */
    .dam-saved-logins {
      /* Ta sama szerokosc i os co formularz logowania (460 px, wysrodkowany) -
         bez tego lista rozlewala sie na cala lewa kolumne. */
      width: 100%;
      max-width: 460px;
      margin: 0 auto 20px;
    }
    .dam-saved-logins[hidden] {
      display: none !important;
    }
    .dam-saved-logins__label {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--dam-text-muted, #6f6b7c);
    }
    .dam-saved-logins__list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .dam-saved-logins__item {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--dam-border, #e7e7e7);
      border-radius: 10px;
      background: var(--dam-surface-muted, #fafafa);
      padding: 8px 8px 8px 12px;
    }
    .dam-saved-logins__id {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      border: 0;
      background: transparent;
      padding: 4px 0;
      cursor: pointer;
      text-align: left;
    }
    .dam-saved-logins__name {
      font-size: 13px;
      font-weight: 600;
      color: var(--dam-text, #464255);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dam-saved-logins__email {
      font-size: 12px;
      color: var(--dam-text-muted, #6f6b7c);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .dam-saved-logins__go {
      flex: 0 0 auto;
      min-height: 36px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid var(--dam-primary, #AB54DB);
      background: transparent;
      color: var(--dam-primary, #AB54DB);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .dam-saved-logins__go:hover {
      background: color-mix(in srgb, var(--dam-primary, #AB54DB) 10%, transparent);
    }
    .dam-saved-logins__remove {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--dam-text-muted, #6f6b7c);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }
    .dam-saved-logins__remove:hover {
      border-color: var(--dam-danger, #ff5b5b);
      color: var(--dam-danger, #ff5b5b);
      background: color-mix(in srgb, var(--dam-danger, #ff5b5b) 8%, transparent);
    }
    /* Pasek autologowania - 2 s na anulowanie */
    .dam-autologin-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 20px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--dam-primary, #AB54DB);
      background: color-mix(in srgb, var(--dam-primary, #AB54DB) 8%, transparent);
      font-size: 13px;
      color: var(--dam-text, #464255);
    }
    .dam-autologin-bar[hidden] {
      display: none !important;
    }
    .dam-autologin-bar__cancel {
      flex: 0 0 auto;
      min-height: 32px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--dam-border, #e7e7e7);
      background: var(--dam-surface, #fff);
      color: var(--dam-text, #464255);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>

<body class="geex-dashboard authentication-page dam-app">
  <main class="geex-content">
    <div class="geex-content__authentication">
      <div class="geex-content__authentication__content">
        <div class="geex-content__authentication__content__wrapper">
          <div class="geex-content__authentication__content__logo">
            <a href="dashboard.html" aria-label="DAM - Dobra Kaloria - Inyfinn">
              <img class="logo-lite dam-logo-dk" src="assets/img/logo-dobra-kaloria.svg" alt="Dobra Kaloria">
              <img class="logo-dark dam-logo-dk" src="assets/img/logo-dobra-kaloria.svg" alt="Dobra Kaloria">
            </a>
          </div>

          <div id="damSavedLoginsList" class="dam-saved-logins" hidden></div>
          <div id="damAutologinBar" class="dam-autologin-bar" hidden role="status" aria-live="polite">
            <span id="damAutologinText"></span>
            <button type="button" class="dam-autologin-bar__cancel" id="damAutologinCancel">Anuluj</button>
          </div>

          <form id="damAuthForm" class="geex-content__authentication__form" autocomplete="on">
            <h2 class="geex-content__authentication__title">Witaj w DAM</h2>
            <p class="geex-content__authentication__subtitle">
              Zaloguj się kontem firmowym. Możesz wylogować się w menu użytkownika.
            </p>

            <div class="dam-auth-mode" id="authModeTabs" role="tablist" aria-label="Tryb konta" hidden>
              <button type="button" class="is-active" id="tabLogin" data-tab="login">Zaloguj</button>
              <button type="button" id="tabRegister" data-tab="register">Utwórz konto</button>
            </div>

            <div class="geex-content__authentication__form-group dam-auth-hidden" id="nameWrap" hidden>
              <label for="authName">Imie i nazwisko</label>
              <input type="text" id="authName" name="name" placeholder="np. Jan Kowalski" autocomplete="name">
              <i class="uil-user" aria-hidden="true"></i>
            </div>

            <div class="geex-content__authentication__form-group">
              <label for="authEmail">Email</label>
              <input type="email" id="authEmail" name="email" required
                     placeholder="np. imie.nazwisko@firma.pl" autocomplete="username">
              <i class="uil-envelope" aria-hidden="true"></i>
            </div>

            <div class="geex-content__authentication__form-group">
              <div class="geex-content__authentication__label-wrapper">
                <label for="authPassword">Hasło</label>
              </div>
              <input type="password" id="authPassword" name="password" required
                     minlength="4" placeholder="Hasło" autocomplete="current-password">
              <i class="uil-eye toggle-password-type" id="togglePassword" role="button"
                 tabindex="0" aria-label="Pokaż lub ukryj hasło"></i>
            </div>

            <div class="geex-content__authentication__form-group custom-checkbox" id="rememberWrap">
              <input type="checkbox" class="geex-content__authentication__checkbox-input"
                     id="rememberDevice" checked>
              <label class="geex-content__authentication__checkbox-label" for="rememberDevice">
                Zapamiętaj to urządzenie
              </label>
            </div>

            <div class="geex-content__authentication__form-group custom-checkbox" id="saveLoginWrap">
              <input type="checkbox" class="geex-content__authentication__checkbox-input"
                     id="saveLoginDevice" checked>
              <label class="geex-content__authentication__checkbox-label" for="saveLoginDevice">
                Zapisz hasło na tym komputerze
              </label>
            </div>

            <div class="geex-content__authentication__form-group custom-checkbox" id="autologinWrap">
              <input type="checkbox" class="geex-content__authentication__checkbox-input"
                     id="autologinDevice">
              <label class="geex-content__authentication__checkbox-label" for="autologinDevice">
                Loguj automatycznie przy starcie
              </label>
            </div>

            <button type="submit" class="geex-content__authentication__form-submit" id="authSubmit">
              Zaloguj
            </button>
            <p class="dam-auth-msg" id="authMsg" role="status" aria-live="polite"></p>

            <div class="geex-content__authentication__form-footer" id="authFooter">
              Nie masz konta. Poproś administratora o dostęp.
            </div>
          </form>
        </div>
      </div>
      <div class="geex-content__authentication__img">
          <img src="./assets/img/auth/kubara-building.jpg"
               alt="Budynek siedziby Kubara w Konstancinie-Jeziornie"
               width="1200" height="1600"
               decoding="async">
      </div>
    </div>
  </main>

  <script src="./assets/js/dam-runtime.js?v=1.8.9"></script>
  <script src="./assets/js/dam-file-index.js?v=2.0.8"></script>
  <script src="./assets/js/dam-api.js?v=2.3.8"></script>
  <script src="./assets/js/dam-activation.js?v=2.3.4"></script>
  <script src="./assets/js/dam-password-change.js?v=2.1.2"></script>
  <script src="./assets/js/dam-saved-logins.js?v=2.3.9"></script>
  <script>
    (function () {
      var mode = "login";
      var registrationOpen = false;
      var tabLogin = document.getElementById("tabLogin");
      var tabRegister = document.getElementById("tabRegister");
      var modeTabs = document.getElementById("authModeTabs");
      var nameWrap = document.getElementById("nameWrap");
      var submitBtn = document.getElementById("authSubmit");
      var msg = document.getElementById("authMsg");
      var pass = document.getElementById("authPassword");
      var footer = document.getElementById("authFooter");
      var toggle = document.getElementById("togglePassword");

      function setMode(m) {
        if (m === "register" && !registrationOpen) {
          m = "login";
        }
        mode = m;
        tabLogin.classList.toggle("is-active", m === "login");
        tabRegister.classList.toggle("is-active", m === "register");
        tabLogin.setAttribute("aria-selected", m === "login" ? "true" : "false");
        tabRegister.setAttribute("aria-selected", m === "register" ? "true" : "false");
        nameWrap.hidden = m !== "register";
        nameWrap.classList.toggle("dam-auth-hidden", m !== "register");
        pass.autocomplete = m === "register" ? "new-password" : "current-password";
        /* Logowanie przyjmuje stare krotkie hasla (most wymusi zmiane); nowe konto: min. 10. */
        pass.minLength = m === "register" ? 10 : 4;
        pass.setAttribute("minlength", m === "register" ? "10" : "4");
        submitBtn.textContent = m === "register" ? "Utwórz konto" : "Zaloguj";
        if (registrationOpen) {
          footer.innerHTML = m === "register"
            ? 'Masz juz konto. <a href="#" id="switchToLogin">Zaloguj się</a>'
            : 'Pierwsze uruchomienie: <a href="#" id="switchToRegister">Utwórz konto admina</a>';
          var link = footer.querySelector("a");
          if (link) {
            link.addEventListener("click", function (e) {
              e.preventDefault();
              setMode(m === "register" ? "login" : "register");
            });
          }
        } else {
          footer.textContent = "Nie masz konta. Poproś administratora o dostęp.";
        }
        msg.textContent = "";
        msg.className = "dam-auth-msg";
      }

      function applyRegistrationPolicy(open) {
        registrationOpen = !!open;
        modeTabs.hidden = !registrationOpen;
        setMode("login");
      }

      /* Domyślnie produkcja: rejestracja ukryta; bootstrap tylko gdy API mowi open. */
      applyRegistrationPolicy(false);
      try {
        var base = (window.DamRuntime && typeof DamRuntime.bridgeUrl === "function")
          ? DamRuntime.bridgeUrl()
          : "http://127.0.0.1:8766";
        var t = "";
        try { t = localStorage.getItem("dam_token") || ""; } catch (_t) { t = ""; }
        var hdr = { cache: "no-store" };
        if (t) hdr.headers = { Authorization: "Bearer " + t };
        fetch(String(base).replace(/\/$/, "") + "/auth/registration-open", hdr)
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data && data.ok && data.open === true) {
              applyRegistrationPolicy(true);
            }
          })
          .catch(function () { /* zostaw ukryte */ });
      } catch (_e) { /* zostaw ukryte */ }

      tabLogin.addEventListener("click", function () { setMode("login"); });
      tabRegister.addEventListener("click", function () { setMode("register"); });

      function flipPassword() {
        var show = pass.type === "password";
        pass.type = show ? "text" : "password";
        toggle.classList.toggle("uil-eye", !show);
        toggle.classList.toggle("uil-eye-slash", show);
      }
      if (toggle) {
        toggle.addEventListener("click", flipPassword);
        toggle.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            flipPassword();
          }
        });
      }

      /* --- Zapisz haslo / autologowanie na tym komputerze --- */
      var saveLoginChk = document.getElementById("saveLoginDevice");
      var autologinChk = document.getElementById("autologinDevice");
      var autologinWrap = document.getElementById("autologinWrap");

      function syncAutologinVisibility() {
        var show = !!(saveLoginChk && saveLoginChk.checked);
        if (autologinWrap) autologinWrap.hidden = !show;
        if (!show && autologinChk) autologinChk.checked = false;
      }
      if (saveLoginChk) {
        saveLoginChk.addEventListener("change", syncAutologinVisibility);
      }
      syncAutologinVisibility();

      function loginOptsFromForm(extra) {
        var save = !!(saveLoginChk && saveLoginChk.checked);
        return Object.assign(
          {
            saveLogin: save,
            autologin: save && !!(autologinChk && autologinChk.checked),
          },
          extra || {}
        );
      }

      /*
       * Obsluga wyniku logowania - WSPOLNA dla formularza (submit) i dla
       * zapisanych kont (dam-saved-logins.js -> mountSignin onResult), zeby nie
       * duplikowac logiki sukcesu / password_change_required / komunikatow bledow.
       */
      function handleAuthSuccess() {
        msg.className = "dam-auth-msg is-ok";
        msg.textContent = "Zalogowano. Przekierowanie...";
        setTimeout(function () { location.replace("dashboard.html"); }, 300);
      }

      function handleAuthError(err, ctx) {
        ctx = ctx || {};
        /* Logowanie zwyklym formularzem znamy haslo - mozna otworzyc zmiane hasla. */
        if (err && err.code === "password_change_required" && window.DamPasswordChange && !ctx.savedLogin) {
          msg.className = "dam-auth-msg";
          msg.textContent = "";
          submitBtn.disabled = false;
          DamPasswordChange.open(
            ctx.email,
            ctx.password,
            function (newPassword) {
              pass.value = newPassword;
              document.getElementById("damAuthForm").requestSubmit();
            },
            {
              onSkip: err.canSkip
                ? function () {
                    return DamApi.login(ctx.email, ctx.password, loginOptsFromForm({ skipPasswordChange: true }))
                      .then(handleAuthSuccess);
                  }
                : null,
            }
          );
          return;
        }
        /* Zapisane konto: haslo nie jest znane w tej karcie (zaszyfrowane po stronie mostu) -
           nie da sie otworzyc zmiany hasla bez niego. Kieruj do zwyklego logowania. */
        if (err && err.code === "password_change_required" && ctx.savedLogin) {
          msg.className = "dam-auth-msg is-err";
          msg.textContent = "To haslo wymaga zmiany. Zaloguj sie recznie ponizej.";
          document.getElementById("authEmail").value = ctx.email || "";
          pass.value = "";
          pass.focus();
          submitBtn.disabled = false;
          return;
        }
        msg.className = "dam-auth-msg is-err";
        msg.textContent = (err && err.message) || "Nie udalo sie zalogowac";
        submitBtn.disabled = false;
      }

      /* --- Zapisane konta + autologowanie (dam-saved-logins.js) --- */
      if (window.DamSavedLogins) {
        DamSavedLogins.mountSignin({
          listEl: document.getElementById("damSavedLoginsList"),
          autoBarEl: document.getElementById("damAutologinBar"),
          autoTextEl: document.getElementById("damAutologinText"),
          autoCancelEl: document.getElementById("damAutologinCancel"),
          onFillEmail: function (email) {
            document.getElementById("authEmail").value = email;
            pass.focus();
          },
          onResult: function (promise, ctx) {
            msg.className = "dam-auth-msg";
            msg.textContent = "Logowanie...";
            submitBtn.disabled = true;
            return promise.then(handleAuthSuccess).catch(function (err) {
              handleAuthError(err, Object.assign({ savedLogin: true }, ctx || {}));
            });
          },
        });
      }

      document.getElementById("damAuthForm").addEventListener("submit", function (e) {
        e.preventDefault();
        if (!window.DamApi) {
          msg.className = "dam-auth-msg is-err";
          msg.textContent = "Brak polaczenia z aplikacja. Uruchom DAM z pulpitu.";
          return;
        }
        if (mode === "register" && !registrationOpen) {
          msg.className = "dam-auth-msg is-err";
          msg.textContent = "Rejestracja publiczna wyłączona. Poproś administratora.";
          return;
        }
        var email = (document.getElementById("authEmail").value || "").trim();
        var password = pass.value || "";
        var name = (document.getElementById("authName").value || "").trim();
        submitBtn.disabled = true;
        msg.className = "dam-auth-msg";
        msg.textContent = mode === "register" ? "Tworzenie konta..." : "Logowanie...";

        var p = mode === "register"
          ? DamApi.register(email, password, name)
          : DamApi.login(email, password, loginOptsFromForm());

        p.then(handleAuthSuccess).catch(function (err) {
          handleAuthError(err, { savedLogin: false, email: email, password: password });
        });
      });
    })();
  </script>

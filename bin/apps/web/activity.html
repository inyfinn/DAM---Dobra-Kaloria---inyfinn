<!doctype html>
<html lang="pl" dir="ltr" class="dam-booting">
<head>
  <script src="./assets/js/dam-panic-reload.js?v=5.0.196"></script>
  <script src="./assets/js/dam-theme.js?v=1.8.8"></script>
  <style id="dam-shell-boot-critical">
html.dam-booting{background:#F6F7F6}html.dam-booting[data-theme="dark"]{background:#060F0C}html.dam-booting body,body.is-booting{opacity:0!important;pointer-events:none}
  </style>
  <link rel="stylesheet" href="./assets/css/dam-shell-boot.css?v=1.8.8">
  <script>
  (function(){var r=document.documentElement;if(!r.classList.contains("dam-booting"))r.classList.add("dam-booting");setTimeout(function(){if(window.__damBootWatchdog)window.__damBootWatchdog("4.5s");},4500);})();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAM - Aktywność</title>
  <link rel="stylesheet" href="./assets/vendor/css/bootstrap/bootstrap.css?v=5.0.196">
  <link rel="stylesheet" href="./assets/vendor/icons/unicons-line.css?v=5.0.205">
  <link rel="stylesheet" href="./assets/css/dam-fonts.css?v=5.0.205">

  <link rel="stylesheet" href="./assets/css/style.css?v=5.0.196">
  <link rel="stylesheet" href="./assets/css/dam-tokens.css?v=1.8.8">
  <link rel="stylesheet" href="./assets/css/dam-primitives.css?v=1.8.8">
  <link rel="stylesheet" href="./assets/css/dam-app.css?v=2.1.1">
  <link rel="stylesheet" href="./assets/css/dam-brand.css?v=2.1.7">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon.svg">
</head>
<body class="geex-dashboard dam-app is-booting">
  <div class="dam-sidebar-backdrop" id="damSidebarBackdrop"></div>
  <header class="geex-header">
    <div class="geex-header__wrapper">
      <div class="geex-header__logo-wrapper">
        <a href="index.html" class="geex-header__logo">
          <img class="logo-lite" src="assets/img/logo-dark.svg" alt="DAM" />
          <img class="logo-dark" src="assets/img/logo-lite.svg" alt="DAM" />
        </a>
      </div>
    </div>
  </header>
  <main class="geex-main-content">
    <div class="geex-sidebar" id="damSidebar">
      <a href="#" class="geex-sidebar__close" id="damSidebarClose" aria-label="Zamknij menu"><i class="uil uil-times"></i></a>
      <div class="geex-sidebar__wrapper">
        <nav class="geex-sidebar__menu-wrapper">
          <ul class="geex-sidebar__menu"></ul>
        </nav>
      </div>
    </div>
    <div class="geex-content">
      <div class="geex-content__header">
        <div class="geex-content__header__content">
          <h2 class="geex-content__header__title">Aktywność</h2>
          <p class="geex-content__header__subtitle">Log działan: kopiowanie ścieżek, otwarcia w Eksploratorze, zmiany ustawien</p>
        </div>
      </div>
      <div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button type="button" class="geex-btn geex-btn--primary" id="auditRefresh">Odśwież</button>
        <span id="auditStatus" style="font-size:12px;color:#8b8d97"></span>
      </div>
      <ul class="dam-audit-list" id="auditList"></ul>
    </div>
  </main>
  <script src="./assets/vendor/js/jquery/jquery-3.5.1.min.js?v=5.0.196"></script>
  <script src="./assets/vendor/js/bootstrap/bootstrap.min.js?v=5.0.196"></script>
  <script src="./assets/js/main.js?v=2.0.1"></script>
  <script src="./assets/js/dam-app.js?v=5.0.196"></script>
  <script src="./assets/js/dam-file-index.js?v=2.0.8"></script>
  <script src="./assets/js/dam-api.js?v=2.1.2"></script>
  <script src="./assets/js/dam-i18n.js?v=5.0.196"></script>
  <script src="./assets/js/dam-runtime.js?v=1.8.9"></script>
  <script src="./assets/js/dam-version.js?v=2.1.5"></script>
  <script src="./assets/js/dam-app-update.js?v=2.1.1"></script>
	<script src="./assets/js/dam-shell.js?v=2.1.7"></script>
  <script src="./assets/js/dam-paths.js?v=2.1.2"></script>
  <script>
    (function () {
      function esc(s) {
        return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      }
      function actionLabel(a) {
        var map = {
          copy_path: "Kopiuj ścieżkę",
          reveal_explorer: "Pokaz w Eksploratorze",
          set_base_path: "Ścieżka bazowa",
          share_synology: "Udostępnij Synology"
        };
        return map[a] || a;
      }
      function render(items) {
        var list = document.getElementById("auditList");
        var status = document.getElementById("auditStatus");
        if (!items.length) {
          list.innerHTML = '<li class="dam-audit-item"><div class="dam-audit-item__top">Brak wpisów</div><div class="dam-audit-item__meta">Akcje (kopiuj / pokaz / ustawienia) pojawia sie tutaj na biezaco.</div></li>';
          status.textContent = "0 wpisów";
          return;
        }
        status.textContent = items.length + " wpisów";
        list.innerHTML = items.map(function (it) {
          return '<li class="dam-audit-item">' +
            '<div class="dam-audit-item__top"><span>' + esc(actionLabel(it.action)) + '</span><span>' + esc(it.user || "") + '</span></div>' +
            '<div class="dam-audit-item__meta">' + esc(it.ts || "") + (it.detail ? " ? " + esc(it.detail) : "") + '</div>' +
            (it.local_path ? '<div class="dam-audit-item__meta">' + esc(it.local_path) + '</div>' : "") +
          '</li>';
        }).join("");
      }
      function load() {
        var local = window.DamPaths ? window.DamPaths.getAuditLog() : [];
        var bridge = window.DamPaths && window.DamPaths.bridgeUrl ? window.DamPaths.bridgeUrl() : "http://127.0.0.1:8766";
        fetch(bridge + "/audit?limit=150")
          .then(function (r) { return r.json(); })
          .then(function (d) {
            var remote = (d && d.items) || [];
            // Prefer remote if available, else local cache
            render(remote.length ? remote : local);
          })
          .catch(function () { render(local); });
      }
      document.getElementById("auditRefresh").addEventListener("click", load);
      load();
    })();
  </script>
</body>
</html>

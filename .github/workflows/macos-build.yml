name: macOS build (DAM.app + .dmg)

# Etap 1 celu: dowod BEZ Maca. Zielony przebieg + PASS w logu --selftest
# znaczy, ze uklad sciezek w pakiecie jest poprawny (to najwieksze ryzyko).
# Windows build zostaje bez zmian, lokalny (bin/scripts/ops/build-installer.ps1 -SkipSync).

on:
  push:
    branches: [macos-port]
    paths:
      - 'bin/apps/desktop/**'
      - 'bin/apps/web/**'
      - 'bin/tooling/build/DAM-macos.spec'
      - '.github/workflows/macos-build.yml'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    # DWIE ARCHITEKTURY, budowane natywnie.
    #
    # Dotad byl tylko macos-latest, czyli Apple Silicon. Na Macu z Intelem
    # (np. MacBook Pro 2017, A1708) pakiet arm64 NIE URUCHAMIA SIE w ogole:
    # obraz montuje sie normalnie, ale ikona aplikacji ma przekreslenie, a po
    # dwukliku system mowi, ze nie potrafi odczytac pliku. To wyglada jak
    # uszkodzony plik, a jest zwykla niezgodnoscia architektury.
    #
    # Swiadomie NIE robimy universal2: wymaga uniwersalnych kol dla KAZDEJ
    # zaleznosci (psycopg2, pillow, onnxruntime), a tych czesto nie ma.
    # Dwa natywne buildy sa nudne i dzialaja.
    strategy:
      fail-fast: false
      matrix:
        include:
          # UWAGA na etykiete Intela. "macos-13" bylo poprawne, dopoki GitHub nie
          # wycofal tych maszyn. Objaw po wycofaniu jest mylacy: zadanie NIE pada,
          # tylko wisi w stanie "queued" z PUSTYM polem runnera i nigdy nie startuje
          # (zmierzone: 50 minut bez przypisania, gdy AppleSilicon konczyl w 100 s).
          # Jesli Intel znowu bedzie wisial bez runnera, sprawdz aktualna etykiete
          # w dokumentacji GitHuba zamiast czekac.
          - runner: macos-15-intel   # Intel (x86_64)
            arch: Intel
          - runner: macos-latest   # Apple Silicon (arm64)
            arch: AppleSilicon
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.arch }}
    timeout-minutes: 40
    # Repo ma domyslnie token tylko do odczytu - bez tego "gh release upload" konczy sie 403.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zaleznosci
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          # rapidocr/psd-tools bywaja bez kol arm64 - nie blokuja buildu (funkcje dodatkowe)
          grep -v -E '^(rapidocr-onnxruntime|psd-tools)' bin/apps/desktop/requirements.txt > /tmp/req-mac.txt
          # requirements-portable.txt to lista, ktora Windows wgrywa do bin/runtime/win/python
          # (build-installer.ps1:112 $rtModules). Jest tam ijson, ktorego nie ma w
          # requirements.txt - bez niego selftest konczy sie FAIL. pythonnet odpada:
          # to most do .NET, na macOS nie istnieje.
          grep -v -E '^(pythonnet|#|$)' bin/apps/desktop/requirements-portable.txt >> /tmp/req-mac.txt
          python -m pip install -r /tmp/req-mac.txt
          python -m pip install 'rapidocr-onnxruntime' 'psd-tools' || echo "OPCJONALNE: brak kol arm64, pomijam"

      - name: Ikona .icns z .ico
        run: |
          set -e
          ICO="bin/apps/desktop/dam_app.ico"
          OUT="bin/tooling/build/dam_app.icns"
          if [ -f "$ICO" ]; then
            mkdir -p /tmp/icon.iconset
            sips -s format png "$ICO" --out /tmp/icon.png
            for SZ in 16 32 64 128 256 512; do
              sips -z $SZ $SZ /tmp/icon.png --out "/tmp/icon.iconset/icon_${SZ}x${SZ}.png" >/dev/null
              sips -z $((SZ*2)) $((SZ*2)) /tmp/icon.png --out "/tmp/icon.iconset/icon_${SZ}x${SZ}@2x.png" >/dev/null
            done
            iconutil -c icns /tmp/icon.iconset -o "$OUT" || echo "iconutil nieudany - build bez ikony"
          fi
          ls -la "$OUT" 2>/dev/null || echo "brak .icns (dopuszczalne)"

      - name: Konfiguracja bazy (pg-config.bundled.json)
        env:
          PG_CONFIG_JSON: ${{ secrets.DAM_PG_CONFIG_JSON }}
        run: |
          # pg_seal._dpapi() dziala tylko na Windows (pg_seal.py:111-113), wiec aktywacja
          # kodem na macOS zwrocilaby dpapi_failed. pg_db._pg_config_candidates() czyta
          # pg-config.bundled.json bezwarunkowo - to jest droga bez zmian w kodzie.
          if [ -n "$PG_CONFIG_JSON" ]; then
            printf '%s' "$PG_CONFIG_JSON" > bin/apps/desktop/data/pg-config.bundled.json
            echo "pg-config.bundled.json zapisany z sekretu"
          else
            echo "BRAK sekretu DAM_PG_CONFIG_JSON - build alfa bez konfiguracji bazy"
          fi

      - name: Build DAM.app
        run: python -m PyInstaller bin/tooling/build/DAM-macos.spec --noconfirm --clean

      - name: Podpis ad-hoc (bez konta Apple Developer)
        run: |
          set -euo pipefail
          APP=dist/DAM.app

          # --deep jest przez Apple ODRADZANY i byl tu zrodlem bledu: podpisuje
          # zagniezdzony kod w zlej kolejnosci i zostawia niepoprawne podpisy na
          # .so/.dylib w srodku pakietu. Efekt na Macu: "aplikacja jest uszkodzona"
          # mimo poprawnego pliku. Podpisujemy OD SRODKA NA ZEWNATRZ, jak chce Apple.
          echo "--- podpisuje zagniezdzone biblioteki ---"
          find "$APP" -type f \( -name '*.dylib' -o -name '*.so' \) -print0 \
            | xargs -0 -n1 codesign --force --timestamp=none -s - || true

          echo "--- podpisuje binarki wykonywalne w Contents/MacOS ---"
          find "$APP/Contents/MacOS" -type f -perm -u+x -print0 \
            | xargs -0 -n1 codesign --force --timestamp=none -s - || true

          echo "--- na koncu sam pakiet ---"
          codesign --force --timestamp=none -s - "$APP"

          echo "--- weryfikacja (tu wyjdzie, jesli cos w srodku jest zle podpisane) ---"
          codesign --verify --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | head -5 || true

          echo "--- architektura pakietu (wazne: arm64 NIE uruchomi sie na Intelu) ---"
          lipo -archs "$APP/Contents/MacOS/DAM" || true

      - name: SELFTEST (dowod ukladu sciezek bez Maca)
        run: |
          set -o pipefail
          dist/DAM.app/Contents/MacOS/DAM --selftest 2>&1 | tee /tmp/selftest.log
          grep -q "selftest: PASS" /tmp/selftest.log

      - name: Rozmiar pakietu
        run: du -sh dist/DAM.app && find dist/DAM.app -name '*.py' | wc -l

      - name: .dmg
        run: |
          set -euo pipefail
          # hdiutil jest wbudowany w macOS - bez brew/create-dmg (tamto to sama kosmetyka).
          #
          # Dotad obraz zawieral GOLY DAM.app: bez skrotu do Aplikacji i bez slowa
          # instrukcji, wiec po zamontowaniu nie bylo wiadomo, co zrobic. Budujemy
          # katalog posredni z jednym i drugim.
          STAGE=dist/dmg-stage
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R dist/DAM.app "$STAGE/DAM.app"
          ln -s /Applications "$STAGE/Aplikacje"
          cp bin/installer/macos/PRZECZYTAJ-MNIE.txt "$STAGE/PRZECZYTAJ-MNIE.txt"

          DMG="dist/DAM-${{ matrix.arch }}.dmg"
          hdiutil create -volname "DAM (${{ matrix.arch }})" -srcfolder "$STAGE" -ov -format UDZO "$DMG"

          # PODPIS SAMEGO OBRAZU. Bez tego niepodpisany .dmg po pobraniu z internetu
          # dostaje kwarantanne, a nowsze macOS odmawiaja go ZAMONTOWAC z komunikatem
          # o nieczytelnym/uszkodzonym obrazie - mimo ze plik jest bajtowo poprawny.
          codesign --force --timestamp=none -s - "$DMG"
          codesign --verify --verbose=2 "$DMG" || true

          ls -la "$DMG"
          echo "--- kontrola: czy obraz da sie zamontowac ---"
          hdiutil verify "$DMG"
          MP=$(mktemp -d)
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MP"
          ls -la "$MP"
          test -d "$MP/DAM.app" || { echo "BLAD: w obrazie nie ma DAM.app"; exit 1; }
          hdiutil detach "$MP"

      - uses: actions/upload-artifact@v4
        with:
          name: DAM-macos-${{ matrix.arch }}
          path: |
            dist/DAM-${{ matrix.arch }}.dmg
            /tmp/selftest.log
          retention-days: 14

      - name: Dolacz do release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "dist/DAM-${{ matrix.arch }}.dmg" --clobber

# DSM :5001 — WYLACZNIE redirecty na kanoniczny Panel-DAM (HTTPS 443).
# Nie serwuj plikow na :5001 — caly ruch -> https://inyfinn.synology.me/Panel-DAM/
# Instalacja: install-panel-dam-synology.ps1 -WithDsm5001Nginx

# Bookmark Google i smieci (spacja / tekst po panel-dam)
location ~* ^/panel-dam\s {
    return 301 https://inyfinn.synology.me/Panel-DAM/;
}

# Literowki: paneldam, dam-panel
location ~* ^/(paneldam|dam-panel)(/.*)?$ {
    return 301 https://inyfinn.synology.me/Panel-DAM$2$is_args$args;
}

# panel-dam / Panel-DAM / panel-dam + sciezka (dashboard.html, assets/...)
location ~* ^/panel-dam(/.*)?$ {
    return 301 https://inyfinn.synology.me/Panel-DAM$1$is_args$args;
}
